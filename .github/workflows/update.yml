name: Update feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "feed.json"
      - "pulse.json"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Build feed.json
        run: python build_feed.py

      - name: Build Spark edition
        run: python build_spark.py

      - name: Build Pulse feed
        run: python build_pulse.py

      - name: Commit feeds
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json pulse.json spark/world.json spark/feed.json spark/edition.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update feeds [skip ci]"
            for i in 1 2 3 4; do
              git push && break
              echo "push failed, rebasing and retrying ($i)"
              git pull --rebase --autostash origin main || true
              sleep 4
            done
          fi
