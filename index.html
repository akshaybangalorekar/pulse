<title>Pulse — My Daily World</title>
<style>
  :root{
    --bg:#0b1220; --surface:#131c2e; --surface2:#1b2740; --line:rgba(255,255,255,.08);
    --text:#e9eefc; --muted:#94a3c4; --accent:#35d0ba; --accent2:#6c8cff;
    --radius:16px; --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:640px;margin:0 auto}

  /* Header */
  header{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.82);
    backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .hrow{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;overflow:hidden;flex:1 1 auto}
  .brand>div{min-width:0;overflow:hidden}
  .logo{width:30px;height:30px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,#1a86d0,#2fd0b0);position:relative}
  .logo::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:2.4px;border-radius:2px;
    background:#fff;box-shadow:0 -5px 0 -0.4px #fff,0 5px 0 -0.4px #fff}
  .brand h1{font-size:16px;margin:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:0 0 0}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--text);display:grid;place-items:center;font-size:16px;cursor:pointer}
  .iconbtn:active{transform:scale(.94)}
  .langbar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
  .langbar button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:6px 9px;border-radius:9px;cursor:pointer}
  .langbar button.on{background:var(--accent);color:#06231e}

  /* Chips */
  nav.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 12px;scrollbar-width:none}
  nav.chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:600;
    cursor:pointer;white-space:nowrap}
  .chip .ic{font-size:14px}
  .chip.on{background:linear-gradient(135deg,var(--accent),#2fb8d0);color:#052b26;border-color:transparent}
  .subchips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
  .subchips::-webkit-scrollbar{display:none}
  .subchip{flex:none;padding:6px 12px;border-radius:999px;background:transparent;border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
  .subchip.on{background:var(--surface2);color:var(--text);border-color:transparent}

  /* Area row */
  .arearow{display:flex;align-items:center;gap:8px;padding:0 14px 10px;font-size:12.5px;color:var(--muted)}
  .arearow .pin{color:var(--accent)}
  .arearow button{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 2px}

  /* Feed */
  main{padding:12px 14px 20px}
  .secdesc{font-size:12.5px;color:var(--muted);margin:2px 2px 12px}
  .card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;align-items:flex-start}
  .card:active{background:var(--surface2)}
  .thumb{width:74px;height:74px;border-radius:12px;flex:none;object-fit:cover;background:var(--surface2)}
  .ph{width:74px;height:74px;border-radius:12px;flex:none;display:grid;place-items:center;
    font-weight:800;font-size:24px;color:#06231e}
  .ctext{min-width:0;flex:1}
  .ctitle{font-size:14.5px;font-weight:650;line-height:1.35;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .cmeta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .cmeta .src{color:#b9c6e2;font-weight:600;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
  .skel{height:98px;border-radius:var(--radius);margin-bottom:10px;
    background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .msg{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 18px;line-height:1.5}
  .msg .big{font-size:30px;display:block;margin-bottom:10px}
  .updated{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0 14px}
  .foot{font-size:11px;color:#6b7a99;text-align:center;padding:16px 20px 8px;line-height:1.6}

  /* Sheet */
  .scrim{position:fixed;inset:0;background:rgba(3,7,15,.6);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
    border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);border-bottom:0;
    transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:38px;height:4px;border-radius:3px;background:#33415f;margin:2px auto 14px}
  .sheet h3{margin:0 0 12px;font-size:16px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .lbl{font-size:13.5px;color:var(--muted)}
  .btn{background:linear-gradient(135deg,var(--accent),#2fb8d0);color:#052b26;border:0;border-radius:12px;
    padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--surface2);color:var(--text)}
  .btn:active{transform:scale(.97)}
  .langbtns{display:flex;gap:6px}
  .langbtns button{border:1px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .langbtns button.on{background:var(--accent);color:#052b26;border-color:transparent}
  .about{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}

  /* Pull to refresh */
  .ptr{height:0;overflow:hidden;text-align:center;color:var(--muted);font-size:12px;transition:height .15s}
  .ptr.on{height:38px;line-height:38px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1 id="greet">Pulse</h1>
          <div class="sub" id="todayline"></div>
        </div>
      </div>
      <div class="grow"></div>
      <div class="langbar" id="langbar">
        <button data-lang="en">EN</button>
        <button data-lang="hi">हिं</button>
        <button data-lang="mr">मर</button>
      </div>
      <button class="iconbtn" id="refreshBtn" aria-label="Refresh">&#8635;</button>
      <button class="iconbtn" id="gearBtn" aria-label="Settings">&#9881;</button>
    </div>
    <div class="arearow">
      <span class="pin">&#128205;</span>
      <span id="areaLabel">Melbourne, VIC</span>
      <button id="locBtn">Use my location</button>
    </div>
    <nav class="chips" id="chips"></nav>
    <div class="subchips" id="subchips" style="display:none"></div>
  </header>

  <div class="ptr" id="ptr">Pull to refresh</div>
  <main>
    <div class="secdesc" id="secdesc"></div>
    <div id="feed"></div>
    <div class="updated" id="updated"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="setTitle">Settings</h3>
  <div class="srow">
    <span class="lbl" id="setLangLbl">Language</span>
    <div class="langbtns" id="setLang">
      <button data-lang="en">English</button>
      <button data-lang="hi">हिंदी</button>
      <button data-lang="mr">मराठी</button>
    </div>
  </div>
  <div class="srow">
    <span class="lbl" id="setLocLbl">Set your location</span>
    <button class="btn ghost" id="setLocBtn">Use my location</button>
  </div>
  <div class="srow" style="display:block">
    <div class="about" id="setAbout"></div>
  </div>
</div>

/* ---------------- data ---------------- */
function dataKey(){return state.cat==="sports"?"sports|"+state.sub:state.cat;}

/* ---------------- state ---------------- */
const state={cat:"top",sub:"all",lang:localStorage.getItem("pulse_lang")||"en",
  area:localStorage.getItem("pulse_area")||"Melbourne, VIC"};
const $=s=>document.querySelector(s);
const t=k=>(T[state.lang]||T.en)[k]||(T.en[k]||k);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- cache ---------------- */
function ck(){return "pulse_v2_"+dataKey()+"_"+state.lang;}
function readCache(){try{const r=localStorage.getItem(ck());return r?JSON.parse(r):null;}catch(e){return null;}}
function writeCache(items){try{localStorage.setItem(ck(),JSON.stringify({t:Date.now(),items:items.slice(0,60)}));}catch(e){}}

/* ---------------- render ---------------- */
function fmtTime(ms){
  const s=(Date.now()-ms)/1000;
  if(s<90) return t("justnow");
  const m=Math.floor(s/60); if(m<60) return m+" "+t("minAgo");
  const h=Math.floor(m/60); if(h<24) return h+" "+t("hrAgo");
  const d=Math.floor(h/24); if(d===1) return t("yesterday");
  return d+"d";
}
function pallet(str){const P=[["#2fd0b0","#0e7f66"],["#6c8cff","#3247b8"],["#ffb454","#c47a12"],["#ff7a9c","#c23c63"],["#7ee08a","#2f9e46"],["#b48cff","#6a3fd0"]];
  let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return P[h%P.length];}
function card(it){
  const c=pallet(it.source||it.title);
  const img=it.image?`<img class="thumb" src="${esc(it.image)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc((it.source||'?')[0].toUpperCase())}'}))">`
    :`<div class="ph" style="background:linear-gradient(135deg,${c[0]},${c[1]})">${esc((it.source||"?").slice(0,1).toUpperCase())}</div>`;
  return `<a class="card" href="${esc(it.link)}" target="_blank" rel="noopener">
    ${img}
    <div class="ctext"><p class="ctitle">${esc(it.title)}</p>
    <div class="cmeta"><span class="src">${esc(it.source||"")}</span><span class="dot"></span><span>${fmtTime(it.date)}</span></div></div></a>`;
}
function renderItems(items){
  $("#feed").innerHTML=items.length?items.map(card).join(""):`<div class="msg"><span class="big">🔍</span>${esc(t("err"))}</div>`;
}
function renderSkeleton(){$("#feed").innerHTML=Array(6).fill('<div class="skel"></div>').join("");}
function renderMsg(txt,ic){$("#feed").innerHTML=`<div class="msg"><span class="big">${ic||"⏳"}</span>${esc(txt)}</div>`;}

/* ---------------- load ---------------- */
let reqSeq=0;
async function load(){
  const seq=++reqSeq;
  const key=dataKey();
  const cached=readCache();
  if(cached&&cached.items&&cached.items.length){ renderItems(cached.items); $("#updated").textContent=t("updated")+" "+fmtTime(cached.t); }
  else renderSkeleton();
  let items=null, gen=null;
  try{
    const res=await fetch("feed.json?b="+Math.floor(Date.now()/300000),{cache:"no-store"});
    if(res.ok){ const j=await res.json(); const d=j.data||{};
      items=d[key+"|"+state.lang]||d[key]||null;
      if(j.generated) gen=new Date(j.generated).getTime(); }
  }catch(e){}
  if(seq!==reqSeq) return;
  if(!items||!items.length){ items=SEED.data[key+"|"+state.lang]||SEED.data[key]||[]; if(SEED.generated) gen=new Date(SEED.generated).getTime(); }
  if(items&&items.length){
    writeCache(items); renderItems(items);
    $("#updated").textContent=t("updated")+" "+fmtTime(gen||Date.now());
  } else if(!(cached&&cached.items&&cached.items.length)){
    renderMsg(t("err"),"📡"); $("#updated").textContent="";
  }
}

/* ---------------- chrome ---------------- */
function buildChips(){
  $("#chips").innerHTML=CATS.map(c=>`<button class="chip ${c.id===state.cat?"on":""}" data-cat="${c.id}">
    <span class="ic">${c.ic}</span>${esc(t(c.k))}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    state.cat=b.dataset.cat;state.sub="all";buildChips();buildSubs();paintDesc();
    window.scrollTo({top:0,behavior:"smooth"});load();
  });
}
function buildSubs(){
  const cat=CATS.find(c=>c.id===state.cat);
  const el=$("#subchips");
  if(!cat.subs){el.style.display="none";el.innerHTML="";return;}
  el.style.display="flex";
  el.innerHTML=cat.subs.map(s=>`<button class="subchip ${s.id===state.sub?"on":""}" data-sub="${s.id}">${esc(t(s.k))}</button>`).join("");
  el.querySelectorAll(".subchip").forEach(b=>b.onclick=()=>{
    state.sub=b.dataset.sub;buildSubs();load();
  });
}
function paintDesc(){$("#secdesc").textContent=t(CATS.find(c=>c.id===state.cat).d);}
function paintLang(){
  document.documentElement.lang=state.lang==="en"?"en":state.lang;
  $("#langbar").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.lang===state.lang));
  $("#setLang").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.lang===state.lang));
  const h=new Date().getHours();
  $("#greet").textContent=(h<12?t("gm"):h<17?t("ga"):t("ge"));
  const loc=state.lang==="hi"?"hi-IN":state.lang==="mr"?"mr-IN":"en-AU";
  $("#todayline").textContent=new Date().toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long"});
  $("#refreshBtn").title=t("refresh");$("#setTitle").textContent=t("settings");
  $("#setLangLbl").textContent=t("language");$("#setLocLbl").textContent=t("setloc");
  $("#setAbout").textContent=t("about");
  $("#locBtn").textContent=t("useLoc");$("#setLocBtn").textContent=t("useLoc");
  $("#areaLabel").textContent=state.area;
  $("#foot").textContent=t("tap");
}
function paintAll(){paintLang();buildChips();buildSubs();paintDesc();}

/* ---------------- location ---------------- */
async function useLocation(){
  $("#areaLabel").textContent=t("loading");
  if(!navigator.geolocation){$("#areaLabel").textContent=state.area;return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude:la,longitude:lo}=pos.coords;
      const r=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage=en");
      const j=await r.json();
      const name=j.locality||j.city||j.principalSubdivision||"Your area";
      const region=j.principalSubdivisionCode?j.principalSubdivisionCode.split("-")[1]:"";
      state.area=name+(region?", "+region:"");
      localStorage.setItem("pulse_area",state.area);
      paintLang();load();
    }catch(e){$("#areaLabel").textContent=state.area;}
  },()=>{$("#areaLabel").textContent=state.area;},{timeout:8000,maximumAge:600000});
}

/* ---------------- sheet ---------------- */
function sheet(on){$("#sheet").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);}

/* ---------------- events ---------------- */
$("#refreshBtn").onclick=()=>{localStorage.removeItem(ck());load();};
$("#gearBtn").onclick=()=>sheet(true);
$("#scrim").onclick=()=>sheet(false);
$("#locBtn").onclick=useLocation;
$("#setLocBtn").onclick=()=>{sheet(false);useLocation();};
$("#langbar").querySelectorAll("button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("#setLang").querySelectorAll("button").forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);sheet(false);});
function setLang(l){if(l===state.lang)return;state.lang=l;localStorage.setItem("pulse_lang",l);paintAll();load();}

/* pull to refresh */
let sy=0,pulling=false;
document.addEventListener("touchstart",e=>{if(window.scrollY<=0){sy=e.touches[0].clientY;pulling=true;}},{passive:true});
document.addEventListener("touchmove",e=>{if(!pulling)return;const dy=e.touches[0].clientY-sy;
  if(dy>60)$("#ptr").classList.add("on");else $("#ptr").classList.remove("on");},{passive:true});
document.addEventListener("touchend",()=>{if(!pulling)return;pulling=false;
  if($("#ptr").classList.contains("on")){localStorage.removeItem(ck());load();}setTimeout(()=>$("#ptr").classList.remove("on"),400);});

/* manifest (for install on Android/desktop; iOS uses the meta tags) */
try{
  const man={name:"Pulse — My Daily World",short_name:"Pulse",display:"standalone",
    background_color:"#0b1220",theme_color:"#0b1220",start_url:".",icons:[]};
  const l=document.createElement("link");l.rel="manifest";
  l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/json"}));
  document.head.appendChild(l);
}catch(e){}

/* go */
paintAll();
load();
</script>
</body>
</html>
