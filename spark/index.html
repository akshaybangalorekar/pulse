":"MrBeast","hook":"He turned attention into a business, and giving into a strategy.","body":["MrBeast is one of the most-watched people in the world. His videos cost millions to make: giant mazes, islands, whole competitions.","The idea behind them is simple: make something so big that people cannot scroll past. He studies his own videos like a scientist, changing one thing at a time to see what works.","He also gives away huge amounts of money and food. Some people praise the giving; others ask whether giving is the same as fixing the problem. Both questions are worth thinking about."],"wow":"He has said he reads the first thirty seconds of a video over and over, because that is where most viewers leave.","act":"Watch one of his videos and write down three things he does in the first minute to keep you watching.","talk":"Ask your family: is giving away money a good way to help, or a show?","more":"https://en.wikipedia.org/wiki/MrBeast","wk":"w_science","quiz":{"q":"MrBeast is best known for...","o":["Huge challenge videos","Cooking shows","News reporting"],"a":0}},{"id":"viral","cat":"creators","t":"How a Video Goes Viral","e":"📈","w":"Viral phenomenon","hook":"It is not luck. It is a pattern.","body":["When a video spreads fast, we say it went viral. But there is usually a reason.","Videos that spread well tend to do three things: they grab you in the first few seconds, they make you feel something strong, and they make you want to send them to a friend.","The platforms then notice. If many people watch a video to the end, the platform shows it to more people. So the loop feeds itself."],"wow":"A video with fewer views but higher 'watch time' can beat one with more views, because the platform cares how long people stayed.","act":"Design a 30-second video idea for something you love. Write the first three seconds word for word. That is the hardest part.","talk":"Ask your family which advert or video they remember, and why.","more":"https://en.wikipedia.org/wiki/Viral_phenomenon","wk":"w_science","quiz":{"q":"Videos spread best when they...","o":["Grab you and make you feel something","Are very long","Have no sound"],"a":0}},{"id":"thinklike","cat":"thinking","t":"How to Think Like a Scientist","e":"🧠","w":"Scientific method","hook":"The most useful habit you will ever build.","body":["A scientist does four things over and over: ask a clear question, make a guess, test the guess, and change their mind if the test disagrees.","The hardest part is the last one. Our brains prefer to be right. Noticing when you are wrong is a skill, and like any skill it gets easier with practice.","You can use this anywhere: in maths, in sport, in arguments with friends. Ask: what would prove me wrong? If nothing could, it is not a belief worth holding."],"wow":"Scientists call a test that could prove you wrong a 'falsifiable' test. If nothing can prove it wrong, it is not science.","act":"Pick one thing you believe about yourself, like 'I am bad at maths'. What test could prove that wrong? Try it.","talk":"Ask your family for a time they changed their mind about something important.","more":"https://en.wikipedia.org/wiki/Scientific_method","wk":"w_maths","quiz":{"q":"A good test is one that could...","o":["Prove you wrong","Always agree with you","Be done quickly"],"a":0}},{"id":"gametheory","cat":"thinking","t":"Game Theory: Winning by Thinking Ahead","e":"♟️","w":"Game theory","hook":"The maths of other people's choices.","body":["Game theory is the study of what happens when your best move depends on what someone else does.","Imagine two shops on a beach. Where should each put their stall? If you think only about yourself, you both end up in the middle, crowded together, and the customers at the ends walk further.","Mathematicians study this to understand traffic, prices, and even why countries behave the way they do. The trick is always to ask: what will the other person do next?"],"wow":"A famous game theory result says that sometimes everyone acting selfishly makes everyone worse off.","act":"Play rock-paper-scissors ten times and write down your opponent's pattern. Then use it to win.","talk":"Ask your family about a decision where they had to guess what someone else would do.","more":"https://en.wikipedia.org/wiki/Game_theory","wk":"w_maths","quiz":{"q":"Game theory studies...","o":["Choices that depend on others","Only board games","How to run fast"],"a":0}},{"id":"disagree","cat":"thinking","t":"Why Two Smart People Can Disagree","e":"🤔","w":"Argument","hook":"Being clever does not stop you being wrong.","body":["Two intelligent people can look at the same facts and reach opposite conclusions. This is not always because one is lying.","It usually happens for three reasons: they trust different evidence, they care about different things, or they are answering slightly different questions without realising it.","The useful move is not to shout louder. It is to find out exactly which of those three is causing the gap."],"wow":"Lawyers and scientists both use this trick: before arguing, agree on what would change your mind.","act":"Next time you disagree with someone, ask them: 'what would change your mind?' See what happens.","talk":"Ask your family about an argument where both sides had a fair point.","more":"https://en.wikipedia.org/wiki/Argument","wk":"w_maths","quiz":{"q":"A useful first step in a disagreement is to...","o":["Find out what evidence you trust","Talk louder","Walk away"],"a":0}},{"id":"montyhall","cat":"thinking","t":"The Puzzle That Fooled Professors","e":"🚪","w":"Monty Hall problem","hook":"Three doors. One prize. Your brain will get it wrong.","body":["Three doors. Behind one is a prize. You pick a door. Then the host, who knows where the prize is, opens a different door showing nothing.","Now he asks: keep your door, or switch? Most people say it makes no difference. It does. Switching wins twice as often.","Why? When you first chose, you had a one-in-three chance. The host's action does not change that. So the other unopened door now carries the remaining two-thirds."],"wow":"When this puzzle was published, thousands of people wrote in to say it was wrong, including some with PhDs. It was not wrong.","act":"Play it with three cups and a friend, twenty times. Always switch. Count how often you win.","talk":"Ask your family to guess before you explain the answer.","more":"https://en.wikipedia.org/wiki/Monty_Hall_problem","wk":"w_maths","quiz":{"q":"In the three-door puzzle, switching wins...","o":["Twice as often","The same","Never"],"a":0}},{"id":"markrober","cat":"creators","t":"Mark Rober: The Engineer Who Builds Pranks","e":"🧪","w":"Mark Rober","hook":"A NASA engineer who turned building things into a job.","body":["Mark Rober worked as an engineer at NASA, helping build parts for the Curiosity rover that landed on Mars.","Then he began making videos where he builds something to solve a problem or settle a question. He is best known for a glitter trap he built to catch people stealing parcels from his porch.","His videos show the whole process: the idea, the failed attempts, the maths, and the finished machine. He often says the failures are the interesting part."],"wow":"He spent months designing the parcel trap, and it took several versions before it worked properly.","act":"Find one annoying thing at home and sketch a machine that would fix it. Label three of its parts.","talk":"Ask your family which boring job they would build a robot for.","more":"https://www.youtube.com/@MarkRober","wk":"w_science","quiz":{"q":"Before YouTube, Mark Rober worked at...","o":["NASA","A bank","A hospital"],"a":0}},{"id":"veritasium","cat":"creators","t":"Veritasium: Ask the Question Properly","e":"🔬","w":"Veritasium","hook":"A physicist who makes you doubt what you think you know.","body":["Derek Muller studied physics and then started making videos under the name Veritasium.","His trick is to ask a question you are sure you know the answer to, then show why most people get it wrong.","He films real experiments, interviews scientists and tests ideas on the street. His point is that a good question is worth more than a quick answer."],"wow":"He made a video asking people to predict how a bicycle would behave, and almost everyone got it wrong.","act":"Pick something you are sure about, then write down one test that could prove you wrong. Try it.","talk":"Ask your family a question you think they will get wrong.","more":"https://www.youtube.com/@veritasium","wk":"w_science","quiz":{"q":"Veritasium is made by...","o":["Derek Muller","Hank Green","Mark Rober"],"a":0}},{"id":"vsauce","cat":"creators","t":"Vsauce: Curiosity as a Superpower","e":"🤔","w":"Vsauce","hook":"Start with one question, end somewhere completely unexpected.","body":["Michael Stevens makes videos as Vsauce, asking questions like how big the biggest thing is, or how long it would take to count to a billion.","Each video starts simple, then follows the idea wherever it goes - into maths, space, the mind or time.","It is really a lesson in following your curiosity instead of stopping at the first answer."],"wow":"His video about counting to a billion has been watched tens of millions of times.","act":"Take one question you have and follow it for three 'and then what?' steps. Write the chain down.","talk":"Ask your family for the strangest question they can think of.","more":"https://www.youtube.com/@Vsauce","wk":"w_maths","quiz":{"q":"Vsauce is known for...","o":["Following curiosity into big ideas","Cooking","Football"],"a":0}},{"id":"kurzgesagt","cat":"creators","t":"Kurzgesagt: Big Ideas, Beautifully Drawn","e":"🎨","w":"Kurzgesagt","hook":"A studio that explains huge ideas in a few animated minutes.","body":["Kurzgesagt - In a Nutshell is a small studio in Germany. They make short animated videos about science, space, biology and the future.","Every video is drawn and animated by hand and checked with experts, so the pictures are beautiful and the facts are solid.","They take a big, difficult idea and make it fit into a few minutes without making it silly."],"wow":"One of their videos can take hundreds of hours of drawing, animation and fact-checking.","act":"Take one big idea you learned and explain it in three drawings. No words allowed.","talk":"Ask your family which big idea they would want explained in five minutes.","more":"https://www.youtube.com/@kurzgesagt","wk":"w_science","quiz":{"q":"Kurzgesagt is a studio from...","o":["Germany","Japan","Brazil"],"a":0}},{"id":"smartereveryday","cat":"creators","t":"SmarterEveryDay: Slow-Motion Science","e":"🎥","w":"SmarterEveryDay","hook":"An engineer who films things too fast for your eyes.","body":["Destin Sandlin is an engineer who makes videos about how things really work, filmed with slow-motion cameras.","He has filmed a bullet in flight, how a cat lands on its feet, and how a helicopter stays up.","His most famous challenge is the backwards bicycle: a bike that steers the wrong way. Even he could not ride it for months, which showed him how deeply our brains learn habits."],"wow":"It took him about eight months of daily practice to ride the backwards bicycle.","act":"Try a habit test: brush your teeth with your other hand tomorrow. Notice how odd it feels.","talk":"Ask your family about a skill that took them a long time to learn.","more":"https://www.youtube.com/@smartereveryday","wk":"w_science","quiz":{"q":"The backwards bicycle taught Destin about...","o":["How the brain learns habits","How to swim","How to cook"],"a":0}},{"id":"minutephysics","cat":"creators","t":"MinutePhysics: Physics in a Minute","e":"⏱️","w":"MinutePhysics","hook":"Hard ideas, drawn fast and clear.","body":["Henry Reich makes short, hand-drawn videos that explain physics in about a minute.","He covers light, gravity, quantum ideas and the strange rules of the very small.","The drawings are simple on purpose. When you have to explain something in sixty seconds, you cannot hide behind big words."],"wow":"If an idea cannot fit in a minute, it is split into several videos instead.","act":"Explain one thing you learned today in exactly one minute. Time yourself.","talk":"Ask your family to explain something they know well in one minute.","more":"https://www.youtube.com/@minutephysics","wk":"w_space","quiz":{"q":"MinutePhysics videos are about...","o":["A minute long","An hour long","Ten seconds"],"a":0}},{"id":"scishow","cat":"creators","t":"SciShow: Answers to Weird Questions","e":"💡","w":"SciShow","hook":"Why is the sky blue? What happens if you never sleep?","body":["SciShow is run by Hank Green and a team of science writers. They answer questions sent in by viewers.","Episodes are short and cover biology, space, chemistry and the human body.","They always say when scientists are not sure yet, which is one of the most honest things a science show can do."],"wow":"The show has answered thousands of viewer questions, from the serious to the very silly.","act":"Write down three questions you would send in. Then try to answer one of them yourself.","talk":"Ask your family which question they would ask a scientist.","more":"https://www.youtube.com/@SciShow","wk":"w_science","quiz":{"q":"SciShow answers questions from...","o":["Viewers","Teachers only","Robots"],"a":0}},{"id":"giertz","cat":"creators","t":"Simone Giertz: Building Deliberately Silly Robots","e":"🤖","w":"Simone Giertz","hook":"She invents machines that are funny on purpose.","body":["Simone Giertz is an inventor from Sweden who became known for building robots that do simple jobs badly, like an alarm clock that slaps you awake.","The point is not the silly robot. The point is that she builds it anyway, films the failures, and moves on to the next idea.","She later cut the back off a brand-new electric car and turned it into a small pickup truck, which she called Truckla."],"wow":"Her robots are designed to fail, and that is exactly what makes them worth watching.","act":"Build the silliest useful machine you can from things at home. Test it and see what goes wrong.","talk":"Ask your family what useless invention they would want.","more":"https://www.youtube.com/@simonegiertz","wk":"w_science","quiz":{"q":"Simone Giertz is known for...","o":["Building funny robots","Singing","Painting"],"a":0}},{"id":"friendsstart","cat":"friends","t":"How Friendships Actually Start","e":"🤝","w":"Friendship","hook":"It is less about being liked, and more about being there.","body":["Most friendships do not start with a big moment. They start with being in the same place, doing the same thing, over and over.","Think about your class. The kids you know best are usually the ones you sit near, or the ones you play the same game with every lunchtime. Scientists have tested this: when teachers changed where kids sat, new friendships formed with the new neighbours.","So the secret is not being the funniest or the best at sport. It is turning up in the same place, with the same people, doing something you both like."],"wow":"In one study, kids who sat next to each other were far more likely to become friends than kids who sat across the room.","act":"Pick one thing you like and do it in the same place every week - a club, a team, the same spot at lunch. Same faces, same time.","talk":"Ask your family how they met their closest friend.","wk":"w_friends","quiz":{"q":"Friendships usually start with...","o":["Being in the same place often","A big moment","Being the best"],"a":0}},{"id":"watchblend","cat":"friends","t":"The 'Watch, Then Blend' Move","e":"👀","w":"Social skills","hook":"The best way to join a game is not to ask.","body":["Most of us were told to walk up and say, 'Can I play?' But think about what that does. Everyone stops, turns around and looks at you. And it is very easy for someone to just say no.","There is a better way, and the people who study play call it watch, then blend. First, watch for a moment. What game is it? Where is the line? Then slide into the action without stopping it. Take your place at the end of the line. Stand in the outfield. Pick up the ball and pass it back.","You are not interrupting. You are joining the thing that is already happening."],"wow":"Kids who blend in get to play far more often than kids who interrupt or ask to be let in.","act":"Next time you want to join, watch for 20 seconds first. Then find the easiest job - the line, the fielding, the passing - and just do that job.","talk":"Ask your family about a time they joined a new group. How did they do it?","wk":"w_friends","quiz":{"q":"The best way to join in is to...","o":["Watch, then blend in","Ask loudly","Wait to be invited"],"a":0}},{"id":"rudeness","cat":"friends","t":"What to Do When Someone Is Rude","e":"🛡️","w":"Respect","hook":"You do not have to win the argument. You just have to stay steady.","body":["Some kids are rude because they are having a bad day. Some are rude because it makes them feel bigger. Either way, it says more about them than about you.","Three things help. Stay calm and do not match their tone - a rude reply turns it into a fight. Say one short, clear sentence, like 'That is not okay' or 'I do not like that'. Then stop talking and move on. And if it keeps happening, tell an adult - a teacher, a coach, your parents. Telling is not being soft. It is being smart.","Here is the surprise: rudeness often fades once people end up doing something side by side. Being on the same team can change how someone treats you."],"wow":"Shared time changes people. Rudeness often fades after a day spent doing things together.","act":"Practise one calm sentence out loud so it is ready when you need it: 'I do not like that. I am going to play over there.'","talk":"Ask your family about a time someone was unkind to them, and what they did.","wk":"w_friends","quiz":{"q":"If someone is rude, the steady move is to...","o":["Stay calm and say one clear sentence","Shout back","Say nothing ever"],"a":0}},{"id":"notpicked","cat":"friends","t":"When You're Not Picked","e":"🏅","w":"Team sport","hook":"It usually says nothing about you.","body":["Being picked last stings. But most of the time it is not about who you are. It is about who the captain thinks will win, or who they already know.","Two moves help. Ask to be next: 'I will go on after this game.' Or change the game: get a ball and start something else nearby. Often two or three kids will drift over.","And remember, the best players are not the ones who were picked first at eleven. They are the ones who kept playing."],"wow":"Plenty of great players were not picked first when they were your age. They just kept turning up.","act":"Learn one game well enough that you can teach it. The kid who can start a game is never left out for long.","talk":"Ask your family which sport or game they were bad at first.","wk":"w_friends","quiz":{"q":"If you are picked last, a good move is to...","o":["Ask to go on next, or start another game","Give up","Argue with the captain"],"a":0}},{"id":"walkaway","cat":"friends","t":"It's Okay to Walk Away - But Do This First","e":"🚶","w":"Friendship","hook":"Leaving is fine. Leaving without a word is what costs you.","body":["If a game is not your thing, it is completely okay to say so and do something else. You do not have to pretend to enjoy everything.","But there is a difference between leaving and disappearing. Before you go, do one small thing. Say where you are going: 'I am going to play handball.' Or invite someone: 'Want to come?' Or say you will be back after.","That one sentence is what keeps you part of the group. Without it, you slowly become the kid who is not there."],"wow":"Groups remember the people who come back. Coming back matters more than being good.","act":"Next time you leave a game, say one sentence first: 'I am going to play handball - come if you want.'","talk":"Ask your family what they do when they are bored at a party.","wk":"w_friends","quiz":{"q":"Before walking away from a game, you should...","o":["Say where you are going","Slip away quietly","Wait to be asked"],"a":0}},{"id":"goodfriend","cat":"friends","t":"How to Be the Friend You'd Want","e":"💛","w":"Friendship","hook":"Friendship is built from small, boring, repeated things.","body":["Big gestures are rare. Friendships are built from small things done often: saving someone a seat, asking how their match went, saying well done when they do well.","The most underrated skill is remembering. Who plays what. Who has a dog. Who gets nervous about maths. Remember it, then ask about it later. People love being remembered.","And be reliable. If you say you will be somewhere, be there. A friend who turns up is worth ten who only say nice things."],"wow":"Psychologists find friendships last longest when both people feel they get roughly as much as they give.","act":"Pick one person and remember one true thing about them this week. Then ask them about it.","talk":"Ask your family what they think makes someone a good friend.","wk":"w_friends","quiz":{"q":"The most underrated friendship skill is...","o":["Remembering things about people","Being funny","Being fast"],"a":0}},{"id":"onegoodfriend","cat":"friends","t":"Why One Good Friend Is Enough","e":"🫂","w":"Friendship","hook":"You do not need to be popular. You need one or two.","body":["It is easy to think everyone else has a huge group of friends. Most do not. Most kids have two or three people they really talk to.","One good friend does more for you than twenty people you only say hi to. A good friend is someone you can be boring with, lose with, and be honest with.","So if you are worrying about being in the cool group, you can put that down. It is not the goal. The goal is one or two people who are glad you exist."],"wow":"Child psychologists say it plainly: kids need one or two good friends. Popularity is not the point.","act":"Think of one person you would like to know better. Do one small thing with them this week.","talk":"Ask your family how many really close friends they have.","wk":"w_friends","quiz":{"q":"What matters most is...","o":["One or two good friends","Being popular","A huge group"],"a":0}},{"id":"girlsandboys","cat":"friends","t":"Playing With Girls (and Boys)","e":"🙂","w":"Friendship","hook":"Half the world is girls. It is worth being good at talking to them.","body":["Around your age, some kids start splitting into boys' groups and girls' groups. It can feel like a rule. It is not.","Plenty of kids your age have friends of both. Girls often play in ways that build different skills - more talking, more taking turns, more making up games together. Boys often play in bigger, faster groups. Being good at both makes you better at both.","And here is the funny part. Studies show kids think gender matters far more than it actually does. When adults mixed up the classroom seating, boys and girls became friends much more often than anyone expected."],"wow":"In one big experiment, simply sitting boys and girls next to each other doubled how often they became friends.","act":"Talk to one person you would not normally talk to this week. Ask what they are into, then just listen.","talk":"Ask your parents about their friends when they were your age.","wk":"w_friends","quiz":{"q":"Having friends of both genders...","o":["Builds more skills","Is against the rules","Is unusual"],"a":0}},{"id":"invite","cat":"friends","t":"How to Invite Someone Over","e":"🏠","w":"Playdate","hook":"The kid who invites is never short of friends.","body":["There is one move that beats almost everything else: inviting someone to your place. Not a big party. Just one person, for an hour or two, doing something you both like.","Keep it simple. Pick someone you have had fun with recently. Say: 'Do you want to come over on Saturday? We could play [thing you both like]. My mum can pick you up.'","Your job as host is to make sure they have a good time. Let them choose sometimes. Never wander off and leave them alone. And keep it short, ending while you are both still having fun."],"wow":"Short playdates work better than long ones. Ending while you both want more beats playing until you are bored.","act":"Think of one person you have had fun with in the last month. Ask your parents if you can invite them over.","talk":"Ask your family to help you plan one thing you could do with a guest.","wk":"w_friends","quiz":{"q":"A good playdate is...","o":["One friend, short and fun","A big crowd, all day","Watching TV"],"a":0}},{"id":"leftout","cat":"friends","t":"When You Feel Left Out","e":"🌧️","w":"Belonging","hook":"It happens to everyone. It still feels awful.","body":["Almost every kid feels left out sometimes. It does not mean something is wrong with you. It means you are a person in a group, and groups are messy.","When it happens, three things help. Tell someone - a parent, a teacher, a grandparent. Do something you are good at, because confidence comes back faster when you are doing something you like. And keep friends in more than one place, so no single group has all the power over your week.","And if it feels like it is happening all the time and you cannot make it stop, that is exactly the moment to tell a grown-up. That is what they are for."],"wow":"Kids who have friends in more than one place - school, a club, family friends - feel left out far less often.","act":"Name three people you could talk to if something was bothering you. Say them out loud.","talk":"Ask your family what they would do if they felt left out.","wk":"w_friends","quiz":{"q":"If you feel left out often, you should...","o":["Tell a grown-up","Keep it secret","Blame yourself"],"a":0}}],"faqs":[{"q":"why is the sky blue","a":"Sunlight is all colours mixed. Air scatters the blue light much more than the red, so blue reaches your eyes from every direction. Try the 'Why the Sky is Blue' topic!","topics":["skyblue"]},{"q":"what is zero","a":"Zero is a symbol for nothing. India gave the world the first clear rules for zero around 628 CE. It made modern maths and computers possible.","topics":["zero"]},{"q":"who invented basketball","a":"A teacher named James Naismith invented basketball in 1891, using a peach basket and a soccer ball.","topics":["nba"]},{"q":"what are the vedas","a":"The Vedas are among the oldest texts humans still use, composed in India over 3,000 years ago. They mix hymns with early science like astronomy and geometry.","topics":["vedas"]},{"q":"how do black holes work","a":"A black hole is where gravity is so strong that nothing, not even light, can escape. Most form when a giant star collapses.","topics":["blackhole"]},{"q":"what is the biggest number","a":"There isn't one. Whatever number you pick, you can always add 1. That idea is called infinity.","topics":["infinity"]},{"q":"how fast can a tennis serve go","a":"The fastest serve ever recorded was 263 km/h by Australia's Sam Groth.","topics":["serve"]},{"q":"why do kangaroos hop","a":"Kangaroos are built for hopping forward. Their big feet and strong tail make it super efficient, and they can't really go backwards.","topics":["kangaroo"]},{"q":"what is gravity","a":"Gravity is the invisible pull that objects with mass have on each other. Earth's gravity keeps you on the ground and the Moon in orbit.","topics":["blackhole"]},{"q":"why is the sea salty","a":"Rain wears down rocks and carries tiny amounts of salt into rivers, and rivers carry it to the sea. Over millions of years, the salt builds up.","topics":[]},{"q":"how do planes fly","a":"Wings are shaped so air moves faster over the top, which lowers the pressure there. The higher pressure below pushes the wing up. That lift holds the plane in the air.","topics":["skyblue"]},{"q":"what is the largest animal in the world","a":"The blue whale. It can grow longer than a basketball court and its heart is the size of a small car.","topics":[]},{"q":"who was aryabhata","a":"Aryabhata was an Indian mathematician and astronomer around 500 CE. He said the Earth spins, and he calculated the length of a year very accurately.","topics":["aryabhata"]},{"q":"why do we sleep","a":"Sleep lets your brain sort memories and your body repair itself. Dreams mostly happen in a stage called REM sleep.","topics":["dreams"]},{"q":"what is pi","a":"Pi is the distance around a circle divided by the distance across it. It is about 3.14 and the digits never end.","topics":["pi"]},{"q":"what is dna","a":"DNA is the instruction book inside every cell that tells your body how to grow and work. It is written in a code of four letters.","topics":[]},{"q":"why do we have leap years","a":"Earth takes about 365 and a quarter days to go around the Sun. Every four years we add an extra day, 29 February, to catch up.","topics":[]},{"q":"what is the fastest animal","a":"The peregrine falcon, which dives at over 300 km/h. On land, the cheetah wins at about 110 km/h.","topics":[]},{"q":"how do you do a three pointer","a":"Shoot from behind the big arc. Aim high, use your legs for power, and add backspin so the ball bounces softly off the rim.","topics":["three"]},{"q":"what is australia's national sport","a":"Australia doesn't have one official national sport, but AFL, cricket and rugby league are the biggest. AFL was invented in Melbourne.","topics":["afl"]}]};

/* ---- gentle 15-minute budget, never shown as a timer ---- */
const SESSION_MS=15*60*1000, COOLDOWN_MS=15*60*1000;
let usedMs=0, lastTick=null, lockedAt=Number(localStorage.getItem("spark_locked")||0);
function locked(){ return lockedAt && Date.now()-lockedAt < COOLDOWN_MS; }
function tick(){
  if(document.hidden||locked()){ lastTick=null; return; }
  const now=Date.now();
  if(lastTick) usedMs += now-lastTick;
  lastTick=now;
  if(usedMs>=SESSION_MS && !lockedAt){ lockedAt=now; localStorage.setItem("spark_locked",String(now)); }
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){tick();lastTick=null;} else lastTick=Date.now(); });

/* ---- memory: streak, read, saved, continue ---- */
function today(){ return new Date().toISOString().slice(0,10); }
function get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function bumpStreak(){
  const days=get("spark_days",[]);
  if(!days.includes(today())){ days.push(today()); set("spark_days",days.slice(-60)); }
  return streak();
}
function streak(){
  const days=get("spark_days",[]);
  let s=0, d=new Date();
  for(;;){
    const k=d.toISOString().slice(0,10);
    if(days.includes(k)){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}
function readSet(){ return new Set(get("spark_read",[])); }
function markRead(id){ const s=readSet(); if(!s.has(id)){ s.add(id); set("spark_read",[...s]); } }
function savedSet(){ return new Set(get("spark_saved",[])); }
function toggleSave(id){ const s=savedSet(); if(s.has(id)) s.delete(id); else s.add(id); set("spark_saved",[...s]); return s.has(id); }
function lastOpened(){ return get("spark_last",null); }
function rememberOpen(o){ set("spark_last",{id:o.id,t:Date.now()}); }

/* ---- understand the screen we are on and lay out for it ---- */
function detectSize(){
  const w=window.innerWidth, h=window.innerHeight;
  const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
  document.documentElement.dataset.size = w>=1100 ? "desktop" : w>=700 ? "tablet" : "phone";
  document.documentElement.dataset.pointer = fine ? "fine" : "touch";
  document.documentElement.dataset.orient = h>=w ? "portrait" : "landscape";
  return document.documentElement.dataset.size;
}
let _lastSize="";
function onResize(){
  const prev=_lastSize; const now=detectSize();
  if(prev && now!==prev){ _lastSize=now; render(); }
  else _lastSize=now;
}
window.addEventListener("resize",onResize);
window.addEventListener("orientationchange",()=>setTimeout(onResize,250));

/* ---- images ---- */
const imgCache={};
async function getImage(t){
  if(imgCache[t.id]!==undefined) return imgCache[t.id];
  imgCache[t.id]=null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.w));
    if(!r.ok) return null;
    const j=await r.json();
    const small=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||null;
    if(!small) return null;
    imgCache[t.id]={big:small.replace(/\/\d+px-/,"/640px-"),small:small};
    return imgCache[t.id];
  }catch(e){return null;}
}
function hydrate(){
  document.querySelectorAll("[data-wid]").forEach(el=>{
    if(el.dataset.done) return; el.dataset.done="1";
    const t=byId[el.getAttribute("data-wid")]; if(!t) return;
    getImage(t).then(im=>{
      if(!im) return;
      const img=el.querySelector("img"); if(!img) return;
      img.onerror=function(){ img.onerror=null; if(im.small&&img.src!==im.small) img.src=im.small; };
      img.src=im.big||im.small;
      img.style.display="block";
      const p=el.querySelector(".ph"); if(p) p.style.display="none";
    });
  });
}

/* ---- item model ---- */
function newsItem(it,cat,show){
  return {kind:"news",id:"n:"+btoa(unescape(encodeURIComponent(it.title))).slice(0,24),
    cat:cat, show:show, title:it.title, img:it.image, source:it.source, date:it.date, link:it.link,
    paras:it.paras, think:it.think};
}
function topicItem(t){
  return {kind:"topic",id:"t:"+t.id, cat:t.cat, show:(CATS.find(c=>c.id===t.cat)||{}).name||"Cool stuff",
    title:t.t, wid:t.id, emoji:t.e, paras:[t.hook].concat(t.body), wow:t.wow, talk:t.talk, more:t.more};
}
function analysisItem(it){
  return {kind:"analysis",id:"x:"+btoa(unescape(encodeURIComponent(it.title))).slice(0,24),
    cat:"tennis", show:"Match analysis", title:it.title, img:it.image, source:it.source, date:it.date,
    link:it.link, paras:it.paras, apply:it.apply};
}
function headItem(x,show){
  return {kind:"head",id:"h:"+btoa(unescape(encodeURIComponent(x.title))).slice(0,24),
    cat:"sport", show:show, title:x.title, source:x.source, link:x.link};
}
const GRAD={frontier:["#5b8cff","#7a5cff"],science:["#12b5a5","#0a7fd0"],thinking:["#6c8cff","#3a3fb8"],
  experiments:["#00c2a8","#0a6fd0"],creators:["#ff5f9e","#e0453a"],bharatiya:["#ffb347","#d64545"],
  bharat_tech:["#ff8a00","#c2410c"],games:["#ff5f9e","#7a5cff"],maths:["#ff8a3d","#ff4d6d"],friends:["#ffb3c7","#ff6b8a"],
  tennis:["#9fe870","#2f9e46"],sport:["#7ad14a","#2f9e46"],coaching:["#c9f5a8","#5fbf46"],screen:["#b06bff","#6a3fd0"]};
function gradFor(cat){ const g=GRAD[cat]||["#ff8a3d","#ff4d6d"]; return "linear-gradient(135deg,"+g[0]+","+g[1]+")"; }
function artInner(o){
  if(o.img) return `<img src="${esc(o.img)}" alt="" loading="lazy" onerror="this.style.display='none'">`+
    `<div class="ph" style="background:${gradFor(o.cat)};display:none">${o.emoji||"📰"}</div>`;
  if(o.wid) return `<div class="ph" style="background:${gradFor(o.cat)}" data-wid="${o.wid}">${o.emoji||"✨"}<img style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0"></div>`;
  return `<div class="ph" style="background:${gradFor(o.cat)}">${o.emoji||"📰"}</div>`;
}
function tileHTML(o,i){
  const sv=savedSet().has(o.id);
  return `<div class="tile anim" style="animation-delay:${Math.min(i*45,320)}ms" onclick="openItem(${CUR_RAIL},${i})">
    <div class="art">${artInner(o)}
      ${o.show?`<div class="badge2">${esc(o.show)}</div>`:""}
      ${sv?`<div class="saved">🔖</div>`:""}</div>
    <div class="tt">${esc(o.title)}</div>
    <div class="tm">${esc(o.source||o.show||"")}</div>
  </div>`;
}
function railHTML(title,items,badge){
  if(!items.length) return "";
  CUR_RAIL=RAILS.length;
  RAILS.push(items);
  const idx=RAILS.length-1;
  return `<section class="rail"><div class="rhead"><h2>${title}</h2>
      ${badge?`<span class="badge">${badge}</span>`:""}<span class="n">${items.length}</span></div>
    <div class="strip">${items.map((o,i)=>tileHTML(o,i)).join("")}</div></section>`;
}

/* ---- chrome ---- */
function chrome(){
  const age=(EDITION&&EDITION.age)||11;
  $("#hbar").innerHTML=`<div class="logo">⚡</div>
    <div><div class="brand">Sp<span>ark</span></div>
      <div class="tag">FOR YOU · AGE ${age}</div></div>
    <div class="grow"></div>
    <div class="pill">🔥 ${streak()}</div>
    <button class="iconbtn" onclick="surprise()" title="Surprise me">🎲</button>
    <button class="iconbtn" onclick="askSheet()" title="Ask">💬</button>`;
  $("#tabs").innerHTML=[["news","News"],["tennis","Tennis"],["ball","Ball sports"]]
    .map(x=>`<button class="${TAB===x[0]?"on":""}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join("");
}
function setTab(t){ TAB=t; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---- render ---- */
function lockScroll(on){
  const y=window.scrollY||0;
  if(on){
    document.documentElement.style.overflow="hidden";
    document.body.style.overflow="hidden";
    document.body.dataset.scrollY=String(y);
  }else{
    document.documentElement.style.overflow="";
    document.body.style.overflow="";
    const v=document.body.dataset.scrollY;
    if(v!==undefined){ window.scrollTo(0,Number(v)||0); delete document.body.dataset.scrollY; }
  }
}
function resetOverlays(){
  const s=$("#sheet"), c=$("#scrim");
  if(s) s.classList.remove("on");
  if(c) c.classList.remove("on");
  lockScroll(false);
}
function render(){
  resetOverlays();
  tick(); chrome(); RAILS=[]; CUR_RAIL=0;
  if(locked()){ $("#app").innerHTML=`<div class="finish"><div class="big">⚡</div>
    <h2>That's plenty for now</h2><p>You've had a good dose. Go play, run around, build something — fresh stories will be here when you're back.</p></div>`;
    $("#foot").textContent=""; return; }
  if(TAB==="tennis") return renderTennis();
  if(TAB==="ball") return renderBall();
  return renderNews();
}
function heroHTML(o){
  return `<div class="hero anim" onclick="openHero()">
    ${o.img?`<img src="${esc(o.img)}" alt="" onerror="this.style.display='none'">`:""}
    <div class="scrim"></div>
    <div class="tx"><span class="chip">⚡ Today's Spark${o.show?" · "+esc(o.show):""}</span>
      <h1>${esc(o.title)}</h1>
      ${o.sub?`<p class="sub">${esc(o.sub)}</p>`:""}
      <button class="cta">▶ Read now</button></div></div>`;
}
let HERO=null;
function openHero(){ if(HERO) openObj(HERO,null); }

function renderNews(){
  const news=(EDITION&&EDITION.news)||[];
  const scr=(EDITION&&EDITION.screen)||[];
  const topics=TOPICS.slice();
  const items=news.map(x=>newsItem(x,x.cat,x.show));
  const tItems=topics.map(topicItem);
  const pick=cat=>tItems.filter(o=>o.cat===cat);
  const hero=items[0]||tItems[0];
  if(hero) hero.sub=hero.paras?hero.paras[0]:"";

  const saved=[...savedSet()].map(id=>items.concat(tItems).find(o=>o.id===id)).filter(Boolean);
  const last=lastOpened();
  const cont=last?items.concat(tItems).find(o=>o.id===last.id):null;

  let html="";
  if(hero) html+=heroHTML(hero);
  html+=`<div class="hint" style="padding-top:12px">Tap a card to open it. Swipe the rows sideways for more.</div>`;
  if(cont) html+=railHTML("▶ Continue", [cont], "PICK UP");
  if(saved.length) html+=railHTML("🔖 Saved", saved);
  html+=railHTML("✨ New today", items, "FRESH");
  html+=railHTML("🚀 Frontier tech", pick("frontier"));
  html+=railHTML("🧠 Big ideas", pick("thinking"));
  html+=railHTML("🧪 Experiments", pick("experiments"));
  html+=railHTML("🔬 Science & space", pick("science"));
  html+=railHTML("💛 Friends & feelings", pick("friends"));
  html+=railHTML("🛕 Bharat & the Vedas", pick("bharatiya").concat(pick("bharat_tech")));
  const cr=pick("creators").sort((a,b)=>(/MrBeast|Viral/i.test(a.title)?1:0)-(/MrBeast|Viral/i.test(b.title)?1:0));
  html+=railHTML("📱 Creators & makers", cr);
  html+=railHTML("🎮 Games", pick("games"));
  html+=railHTML("📚 Cool stuff", pick("maths").concat(pick("aussie")));
  if(scr.length) html+=railHTML("🎬 Screen picks", scr.map(x=>headItem(x,"Screen")));
  $("#app").innerHTML=html;
  $("#foot").textContent="Stories picked for you. Pictures from the publishers and Wikipedia.";
  hydrate();
}

function renderTennis(){
  const sport=(EDITION&&EDITION.sport)||[];
  const ana=sport.filter(x=>x.section==="Match analysis").map(analysisItem);
  const coach=TOPICS.filter(t=>t.cat==="coaching").map(topicItem);
  const tips=sport.filter(x=>x.section==="Coaching tips").map(x=>headItem(x,"Coaching tips"));
  const juniors=sport.filter(x=>x.section==="Junior stars (10-12)").map(x=>headItem(x,"Junior stars"));
  const hero=ana[0]||coach[0];
  if(hero) hero.sub=hero.paras?hero.paras[0]:"";
  let html="";
  if(hero) html+=heroHTML(hero);
  html+=`<div class="hint" style="padding-top:12px">Real match analysis you can use, plus coaching to try before your next hit.</div>`;
  html+=railHTML("🎾 Match analysis", ana, "NEW");
  html+=railHTML("🎯 Coaching corner", coach);
  html+=railHTML("📝 Coaching in the news", tips);
  html+=railHTML("⭐ Junior stars (10-12)", juniors);
  $("#app").innerHTML=html; $("#foot").textContent="Tennis analysis, coaching and junior achievements."; hydrate();
}
function renderBall(){
  const sport=(EDITION&&EDITION.sport)||[];
  const bb=sport.filter(x=>x.section==="Basketball").map(x=>headItem(x,"Basketball"));
  const fb=sport.filter(x=>x.section==="Football").map(x=>headItem(x,"Football"));
  const hero=bb[0]||fb[0];
  let html="";
  if(hero) html+=heroHTML(hero);
  html+=`<div class="hint" style="padding-top:12px">Tactics, not gossip — how the game is played and why.</div>`;
  html+=railHTML("🏀 Basketball", bb);
  html+=railHTML("⚽ Football", fb);
  if(!bb.length && !fb.length) html+=`<div class="hint">Updates coming soon.</div>`;
  $("#app").innerHTML=html; $("#foot").textContent="Basketball and football analysis."; hydrate();
}
function surprise(){
  const all=RAILS.reduce((a,r)=>a.concat(r),[]);
  if(!all.length) return;
  const o=all[Math.floor(Math.random()*all.length)];
  openObj(o,null);
}

/* ---- detail sheet ---- */
function bodyHTML(o){
  let h="";
  h+= o.img? `<img class="simg" src="${esc(o.img)}" alt="" onerror="this.style.display='none'">`
      : o.wid? `<div class="sph" data-wid="${o.wid}" style="background:${gradFor(o.cat)}"><span>${o.emoji||"✨"}</span>
                <img style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></div>`
      : `<div class="sph" style="background:${gradFor(o.cat)}">${o.emoji||"📰"}</div>`;
  h+=`<div class="sin"><div class="skick">${esc(o.show||"")}</div><h1>${esc(o.title)}</h1>`;
  (o.paras||[]).forEach(p=>{ h+=`<p class="read">${esc(p)}</p>`; });
  if(o.apply) h+=`<div class="box apply"><b>🎾 Use it in your game</b>${esc(o.apply)}</div>`;
  if(o.wow) h+=`<div class="box wow"><b>🤯 Wow fact</b>${esc(o.wow)}</div>`;
  if(o.think) h+=`<div class="box think"><b>💡 Think about it</b>${esc(o.think)}</div>`;
  if(o.talk) h+=`<div class="box talk"><b>💬 Bring this up with your mates</b>${esc(o.talk)}</div>`;
  if(o.link) h+=`<a class="more" href="${esc(o.link)}" target="_blank" rel="noopener">Read the full story →</a>`;
  if(o.more) h+=`<a class="more" href="${esc(o.more)}" target="_blank" rel="noopener">Go deeper →</a>`;
  if(o.source) h+=`<div class="credit">Adapted for you from ${esc(o.source)}</div>`;
  h+=`<div class="wisdom">${esc(wisdom())}</div>`;
  const lastInRail=(function(){ const r=RAILS[CUR_RAIL]||[]; return CUR_IDX>=r.length-1; })();
  h+=`<div class="snav">
      <button onclick="toggleSaveCurrent()" id="saveBtn">${savedSet().has(o.id)?"🔖 Saved":"🔖 Save"}</button>
      <button class="pri" onclick="nextInRail()">${lastInRail?"Done ✓":"Next →"}</button></div>`;
  h+=`</div>`;
  return h;
}
function findRail(o){
  for(let i=0;i<RAILS.length;i++){ const k=RAILS[i].findIndex(x=>x.id===o.id); if(k>-1) return [i,k]; }
  return [0,0];
}
function openObj(o,railIdx){
  if(railIdx===null||railIdx===undefined){ const f=findRail(o); CUR_RAIL=f[0]; CUR_IDX=f[1]; }
  else { CUR_RAIL=railIdx; const k=(RAILS[railIdx]||[]).findIndex(x=>x.id===o.id); CUR_IDX=k>-1?k:0; }
  CUR={o:o};
  try{
    $("#sbody").innerHTML=bodyHTML(o);
    const lbl=$("#sheetLbl"); if(lbl) lbl.textContent=o.show||"Spark";
    $("#sbody").scrollTop=0;
    $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
    lockScroll(true);
    if(o.id){ markRead(o.id); rememberOpen(o); }
    bumpStreak(); chrome();
    hydrate();
  }catch(err){
    resetOverlays();
    console.warn("open failed",err);
  }
}
function openItem(railIdx,idx){
  const rail=RAILS[railIdx]||[];
  const o=rail[idx]; if(!o) return;
  openObj(o,railIdx);
}
function nextInRail(){
  const rail=RAILS[CUR_RAIL]||[];
  const n=CUR_IDX+1;
  if(n>=rail.length){ closeSheet(); return; }
  CUR_IDX=n; openObj(rail[n],CUR_RAIL);
}
function toggleSaveCurrent(){
  if(!CUR) return;
  const on=toggleSave(CUR.o.id);
  const b=$("#saveBtn"); if(b) b.textContent=on?"🔖 Saved":"🔖 Save";
}
function closeSheet(){
  const s=$("#sheet"), c=$("#scrim");
  if(s) s.classList.remove("on");
  if(c) c.classList.remove("on");
  lockScroll(false);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
window.addEventListener("pageshow",()=>resetOverlays());

/* ---- ask ---- */
function askSheet(){
  $("#app").innerHTML=`<section class="rail"><div class="rhead"><h2>💬 Ask anything</h2></div></section>
    <div class="hint">Wondering about something you read? Type it here.</div>
    <div style="padding:8px 18px 0"><input class="askinput" id="q" placeholder="e.g. How does a black hole work?"></div>
    <div style="padding:14px 18px"><button class="cta" style="width:100%;justify-content:center" onclick="doAsk()">Find my answer</button></div>
    <div id="res" style="padding:0 18px"></div>`;
  $("#q").addEventListener("keydown",e=>{if(e.key==="Enter")doAsk();});
}
const STOP=new Set(["what","is","the","a","an","how","why","do","does","can","you","me","tell","about","of","to","in","and","for","it","are","was","were","who","when","where","which","i","my","more"]);
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
function doAsk(){
  const q=($("#q").value||"").trim(); if(!q) return;
  const toks=norm(q).split(" ").filter(w=>w.length>2&&!STOP.has(w));
  const sc=t=>{const T=norm(t);let s=0;for(const w of toks){if(T.includes(w))s++;}return s;};
  const faqs=FAQS.map(f=>({s:sc(f.q+" "+f.a),f})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const tops=TOPICS.map(t=>({s:sc(t.t+" "+t.hook+" "+t.body.join(" ")+" "+(t.wow||"")),t})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  let html="";
  if(faqs.length) html+=`<div class="box wow"><b>Here's the idea</b>${esc(faqs[0].f.a)}</div>`;
  if(tops.length){
    html+=`<div style="font-weight:800;margin:14px 2px 8px">Read this next</div>`;
    html+=tops.slice(0,2).map(x=>`<div class="box talk"><b>${esc(x.t.t)}</b>${esc(x.t.hook)}</div>`).join("");
  }
  if(!faqs.length && !tops.length){
    const mail=`mailto:akshay.bangalorekar@gmail.com?subject=Spark%20doubt&body=${encodeURIComponent(q)}`;
    html=`<div class="box think"><b>Good question!</b>I don't have that one yet. Send it to Dad and he'll add it.
      <div style="margin-top:10px"><a class="more" href="${mail}">Send to Dad</a></div></div>`+html;
  }
  $("#res").innerHTML=html;
}

/* ---- boot ---- */
async function loadEdition(){
  try{const r=await fetch("edition.json",{cache:"no-store"});
    if(r.ok){EDITION=await r.json(); return true;}}catch(e){}
  return false;
}
(async function(){ detectSize(); _lastSize=document.documentElement.dataset.size; await loadEdition(); bumpStreak(); render(); })();
</script>
