<title>Spark — today's edition</title>
<style>
  :root{--bg:#fff7f0;--card:#fff;--ink:#20243f;--muted:#7c8098;--line:#f0e7dd;--pop:#ff6b3d;
    --shadow:0 8px 26px rgba(70,45,20,.10)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(820px 420px at 100% -6%,#ffe7cd 0,transparent 62%),
    radial-gradient(700px 420px at -10% 4%,#dff2ff 0,transparent 58%),var(--bg);background-attachment:fixed;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:600px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
    background:rgba(255,247,240,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .hbar{display:flex;align-items:center;gap:11px;padding:10px 16px 8px}
  .logo{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(135deg,var(--pop),#ffb020);box-shadow:0 4px 12px rgba(255,107,61,.4)}
  .brand{font-size:18px;font-weight:800;line-height:1.05}
  .brand span{color:var(--pop)}
  .tag{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .grow{flex:1}
  .count{font-size:12px;font-weight:800;color:var(--muted)}
  .iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;
    display:grid;place-items:center;font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
  .tabs{display:flex;gap:6px;padding:0 14px 8px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:14.5px;
    padding:9px 4px;border-radius:12px;cursor:pointer;font-family:inherit}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .bar{height:3px;background:var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pop),#ffb020);width:0;transition:width .25s}

  main{flex:1;padding:14px 16px 8px;display:flex;flex-direction:column}
  .card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);flex:1;
    display:flex;flex-direction:column;animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .imw{position:relative;width:100%;aspect-ratio:16/10;background:#efe7de;overflow:hidden;flex:none}
  .imw img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
  .imw .ph{position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-size:48px;
    background:linear-gradient(135deg,#ffe9d6,#ffe0ec)}
  .kchip{position:absolute;z-index:2;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;
    backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.4px}
  .body{padding:16px 17px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .head{font-size:21px;font-weight:800;line-height:1.26;margin-bottom:11px}
  p.read{font-size:16.5px;line-height:1.62;margin:0 0 12px}
  .think{background:linear-gradient(135deg,#fff1c9,#ffe0b0);border:1px solid #ffd88a;border-radius:15px;
    padding:13px 15px;margin:14px 0 10px;font-size:15.5px;line-height:1.5}
  .think b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#a86a00;margin-bottom:5px}
  .wisdom{font-size:13px;color:#9a8f86;font-style:italic;line-height:1.5;margin:14px 2px 2px;
    padding-left:12px;border-left:3px solid #ffd9c4}
  .credit{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px}
  .more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:11px 15px;border-radius:14px;
    background:linear-gradient(135deg,#eef3ff,#e6ecff);border:1px solid #cfdaff;color:#2f4bd6;
    font-size:14px;font-weight:800;text-decoration:none}
  .wow{background:linear-gradient(135deg,#e4fbf6,#d2f4ff);border:1px solid #b6ebdf;border-radius:15px;
    padding:13px 15px;margin:12px 0;font-size:15.5px;line-height:1.5}
  .wow b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#0a8f83;margin-bottom:5px}
  .talk{background:linear-gradient(135deg,#efe8ff,#f6e6ff);border:1px solid #dccdfa;border-radius:15px;
    padding:13px 15px;margin:12px 0;font-size:15.5px;line-height:1.5}
  .talk b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#6a44d8;margin-bottom:5px}

  nav{display:flex;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  .btn{flex:1;text-align:center;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;
    cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .btn.primary{background:linear-gradient(135deg,var(--pop),#ffb020);color:#fff;flex:2}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.4}
  .btn:active{transform:scale(.98)}

  /* sport */
  .sport{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sect{font-size:15px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
  .sect:first-child{margin-top:4px}
  .hcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:9px}
  .hcard .t{font-size:15.5px;font-weight:700;line-height:1.34;margin-bottom:6px}
  .hcard .m{font-size:11.5px;color:var(--muted);font-weight:650}
  .explain{background:linear-gradient(135deg,#e4fbf6,#d2f4ff);border:1px solid #b6ebdf;border-radius:16px;
    padding:14px 15px;font-size:15px;line-height:1.55;margin-bottom:12px}
  .hcard.coach{background:linear-gradient(135deg,#f3ffe9,#e8fbe0);border:1px solid #cdeeb0}
  .hcard.coach .ct{font-size:16px;font-weight:800;margin-bottom:5px}
  .hcard.coach .ch{font-size:13.5px;color:#3d7a2a;font-weight:800;margin-bottom:8px}
  .hcard.coach p.cb2{font-size:15px;line-height:1.55;margin:0 0 9px}
  .hcard.coach .cw{background:#fff;border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.5}
  .hcard.coach .cw b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#3d7a2a;margin-bottom:4px}
  .explain b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#0a8f83;margin-bottom:6px}

  .finish{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:30px 22px;gap:6px}
  .finish .big{font-size:52px}
  .finish h2{font-size:23px;margin:8px 0 4px}
  .finish p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 18px;max-width:34ch}
  .askrow{display:flex;gap:10px;width:100%;max-width:320px}
  .loading{text-align:center;padding:60px;color:var(--muted)}
  .foot{text-align:center;font-size:11px;color:var(--muted);padding:8px 20px 0}
</style>
</head>
