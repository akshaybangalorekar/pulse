"use strict";
const C = {"cats":[{"id":"maths","name":"Maths Magic","emoji":"🔢","c1":"#ff8a3d","c2":"#ff4d6d"},{"id":"science","name":"Science Lab","emoji":"🔬","c1":"#3ddc97","c2":"#0aa2c0"},{"id":"tennis","name":"Tennis","emoji":"🎾","c1":"#c8f04a","c2":"#4aa832"},{"id":"basketball","name":"Basketball","emoji":"🏀","c1":"#ff9f45","c2":"#e0533a"},{"id":"bharatiya","name":"Bharatiya Stories","emoji":"📖","c1":"#ffb347","c2":"#d64545"},{"id":"aussie","name":"Cool Australia","emoji":"🦘","c1":"#4db8ff","c2":"#3a5fe0"},{"id":"bharat_tech","name":"Bharat Tech","emoji":"🚀","c1":"#ff8a00","c2":"#c2410c"},{"id":"games","name":"Games","emoji":"🎮","c1":"#ff5f9e","c2":"#7a5cff"},{"id":"frontier","name":"Frontier Tech","emoji":"🔭","c1":"#5b8cff","c2":"#7a5cff"},{"id":"coaching","name":"Tennis coaching","emoji":"🎾","c1":"#9fe870","c2":"#2f9e46"},{"id":"experiments","name":"Experiments","emoji":"🧪","c1":"#00c2a8","c2":"#0a6fd0"},{"id":"thinking","name":"Big ideas","emoji":"🧠","c1":"#6c8cff","c2":"#3a3fb8"},{"id":"creators","name":"Creators","emoji":"📱","c1":"#ff5f9e","c2":"#e0453a"}],"topics":[{"id":"zero","cat":"maths","t":"Zero the Superhero","e":"0⃣","w":"0","hook":"The number that changed the world came from India.","body":["Imagine a world with no zero. You could not write 10, 100 or 2026. You could not say 'none'. Weird, right?","Long ago, mathematicians in India worked out that you need a symbol for nothing. The great Indian mathematician Brahmagupta wrote the first clear rules for zero around 628 CE.","Zero travelled from India to the Arab world and then to Europe, and it helped create modern maths, computers and even this app. Every time you type a 0, you are using a 1,400-year-old Indian idea."],"wow":"Without zero, computers could not exist. Everything digital is built on just 0s and 1s.","act":"Write the biggest number you can using only three digits. Now do it again without using 0. How much smaller is it?","talk":"Ask your family: what would break in the world if zero disappeared tomorrow?","wk":"w_maths","quiz":{"q":"Which country gave the world the first clear rules for zero?","o":["India","Greece","Egypt"],"a":0}},{"id":"primes","cat":"maths","t":"Prime Numbers: The Untouchables","e":"🔒","w":"Prime number","hook":"The numbers that refuse to be split.","body":["A prime number can only be divided by 1 and itself. 7 is prime. 8 is not, because 8 is 2 x 4.","Primes are the building blocks of all numbers, like atoms are for stuff. Every whole number bigger than 1 is made by multiplying primes together.","Mathematicians have hunted primes for over 2,000 years. The biggest one known has more than 40 million digits. Writing it out would fill a small library."],"wow":"There are infinitely many primes. Euclid proved it 2,300 years ago with one clever sentence.","act":"Find all the primes between 1 and 30. Hint: cross out multiples of 2, 3 and 5 first. How many are left?","talk":"Ask someone: why do you think we still care about primes after 2,000 years?","wk":"w_maths","quiz":{"q":"Which of these is a prime number?","o":["21","29","33"],"a":1}},{"id":"fibonacci","cat":"maths","t":"Fibonacci in Nature","e":"🌻","w":"Fibonacci number","hook":"A number pattern hiding in sunflowers and pinecones.","body":["Start with 1 and 1. Add the last two numbers to get the next: 1, 1, 2, 3, 5, 8, 13, 21...","This is the Fibonacci sequence. The surprising part? It shows up in nature. Count the spirals on a pinecone or a sunflower and you often find 8, 13, 21 or 34.","It is not magic, it is maths. Plants grow in ways that pack seeds most efficiently, and Fibonacci numbers just happen to fit best."],"wow":"A nautilus shell, a pineapple and a spiral galaxy can all follow similar spiral maths.","act":"Next time you eat a pineapple, count the spirals going each way. Do you get two Fibonacci numbers?","talk":"Ask your family to guess what a sunflower and a galaxy have in common.","wk":"w_maths","quiz":{"q":"What comes after 1, 1, 2, 3, 5, 8?","o":["11","13","16"],"a":1}},{"id":"infinity","cat":"maths","t":"Infinity: Can You Count Forever?","e":"♾️","w":"Infinity","hook":"There is always more.","body":["Pick the biggest number you can think of. Add 1. You just beat it. That is the idea behind infinity.","Mathematicians found something wild: some infinities are BIGGER than others. The infinity of counting numbers is smaller than the infinity of all decimals.","Georg Cantor proved this in the 1800s and many mathematicians thought he was crazy. He was right."],"wow":"There are exactly as many even numbers as there are whole numbers, even though half of all numbers are even.","act":"Match every whole number with an even number: 1 to 2, 2 to 4, 3 to 6. You never run out. That is why they are the same size.","talk":"Ask someone older: does infinity make their head spin too?","wk":"w_maths","quiz":{"q":"Is the infinity of decimals bigger than the infinity of counting numbers?","o":["Yes","No","Nobody knows"],"a":0}},{"id":"pi","cat":"maths","t":"Pi: The Number That Never Ends","e":"🥧","w":"Pi","hook":"3.14... and it keeps going forever.","body":["Pi is the distance around a circle divided by the distance across it. It is about 3.14, but the digits go on forever with no pattern.","People have memorised tens of thousands of digits. Computers have calculated over 100 trillion digits and it still has not ended.","Pi shows up everywhere: in waves, in sound, in space missions and even in the way rivers bend."],"wow":"March 14 (3/14) is Pi Day, and it is also Albert Einstein's birthday.","act":"Wrap string around a cup, then measure the string and the cup's width. Divide them. Did you get about 3.14?","talk":"Ask your family: how many digits of pi can they remember?","wk":"w_maths","quiz":{"q":"Pi is the distance around a circle divided by what?","o":["Its width","Its colour","Its weight"],"a":0}},{"id":"skyblue","cat":"science","t":"Why the Sky is Blue","e":"🌌","w":"Rayleigh scattering","hook":"Sunlight is secretly a rainbow.","body":["Sunlight looks white, but it is really all colours mixed together. When it hits the air, tiny gas molecules scatter the blue light far more than the red.","So blue light bounces all around the sky and reaches your eyes from every direction. The sky looks blue.","At sunset, light travels through more air, the blue gets scattered away, and you are left with reds and oranges."],"wow":"On the Moon there is no air, so the sky is always black, even in daytime.","act":"Look at the sky at noon, then again at sunset. Write down how the colour changes. Can you explain why?","talk":"Ask your family what colour they think the sky is on Mars.","wk":"w_science","quiz":{"q":"Why is the sky blue?","o":["Air scatters blue light","The sea reflects up","Clouds are blue"],"a":0}},{"id":"blackhole","cat":"science","t":"Black Holes: The Hungriest Things","e":"🕳️","w":"Black hole","hook":"Nothing escapes, not even light.","body":["A black hole is a place where gravity is so strong that nothing, not even light, can escape. That is why it is black.","Most form when a giant star runs out of fuel and collapses. Some are millions of times heavier than our Sun.","In 2019, scientists took the first-ever picture of a black hole. It looked like a glowing ring with a dark middle."],"wow":"If you fell into a black hole, time would slow down for you compared to everyone else. Space and time get weird near one.","act":"Blow up a balloon with dots drawn on it. Watch the dots move apart. That is how space stretches.","talk":"Ask someone: what would you want to see if you could peek inside a black hole?","wk":"w_space","quiz":{"q":"Why is a black hole black?","o":["Light cannot escape","It is painted","It is very far away"],"a":0}},{"id":"vaccines","cat":"science","t":"Vaccines: Training Your Body's Army","e":"💉","w":"Vaccine","hook":"How a tiny poke makes you stronger.","body":["Your body has an army: your immune system. It learns to fight germs it has met before.","A vaccine shows your body a harmless piece of a germ. Your army practises, remembers it, and is ready if the real germ ever shows up.","Vaccines wiped out smallpox completely and made diseases like polio incredibly rare."],"wow":"Smallpox killed millions for centuries. In 1980 it became the first human disease ever erased from the planet.","act":"Think of a time you got better from a cold. Your body remembered that germ. That is immunity.","talk":"Ask your family which disease they are happiest was wiped out.","wk":"w_science","quiz":{"q":"A vaccine helps your body...","o":["Practise fighting a germ","Forget germs","Sleep better"],"a":0}},{"id":"dreams","cat":"science","t":"Why We Dream","e":"💤","w":"Dream","hook":"Your brain's midnight movie.","body":["Every night your brain runs a private cinema. You dream mostly during a stage called REM sleep.","Scientists think dreams help you sort memories, practise scary situations and solve problems. Some people even solve puzzles in their sleep.","You dream about 4 to 6 times a night, but you forget almost all of it within minutes of waking."],"wow":"Some people can control their dreams. It is called lucid dreaming. They realise they are dreaming and change the story.","act":"Keep a notebook by your bed. Write one line about your dream the second you wake. Do it for a week and spot patterns.","talk":"Ask your family about the strangest dream they have ever had.","wk":"w_science","quiz":{"q":"Dreams mostly happen in which sleep stage?","o":["REM","Deep sleep","Afternoon nap"],"a":0}},{"id":"electricity","cat":"science","t":"Electricity: The Invisible River","e":"⚡","w":"Electricity","hook":"The power hiding inside your walls.","body":["Electricity is the flow of tiny particles called electrons. When they move through a wire, they carry energy.","That energy can become light, heat, sound or movement. Your phone, your TV and your fridge all run on it.","Lightning is the same idea on a giant scale, a huge spark jumping between clouds and the ground."],"wow":"A bolt of lightning is about five times hotter than the surface of the Sun.","act":"Rub a balloon on your hair and hold it near tiny paper bits. That is static electricity, electrons jumping.","talk":"Ask your family to guess how many things in your house use electricity.","wk":"w_science","quiz":{"q":"Electricity is the flow of...","o":["Electrons","Water","Air"],"a":0}},{"id":"serve","cat":"tennis","t":"The Serve: The Shot You Own","e":"🎾","w":"Serve (tennis)","hook":"The one shot where you control everything.","body":["The serve starts every point, and it is the only shot where you decide everything. No opponent is involved.","Pros toss the ball, arch their back and whip the racket up. The best serves reach 250 km/h.","There are three main types: flat (fast), slice (curves sideways) and kick (bounces high). Mixing them keeps the returner guessing."],"wow":"The fastest serve ever recorded was 263 km/h by Sam Groth of Australia.","act":"Practise your toss 20 times without hitting. The ball should go up and come down in front of you, not behind.","talk":"Ask your family: which is scarier to face, a fast serve or a tricky spin serve?","wk":"w_tennis","quiz":{"q":"Which serve bounces high and pushes the returner back?","o":["Kick","Flat","Slice"],"a":0}},{"id":"topspin","cat":"tennis","t":"Topspin: The Dipping Ball","e":"🌀","w":"Topspin","hook":"Why a pro's forehand dives like a plane landing.","body":["Topspin happens when you brush up the back of the ball. The ball spins forward and dives down fast.","That spin lets players hit hard AND keep the ball in the court. It also makes the ball kick up high when it bounces.","Rafael Nadal's heavy topspin once made the ball spin over 5,000 times a minute."],"wow":"Spin can bend a ball's path in the air. That is why a curveball confuses batters in cricket and baseball too.","act":"Brush up the back of the ball slowly and watch it dip. Now brush down (backspin) and watch it float.","talk":"Ask someone to watch a rally and spot which player uses more spin.","wk":"w_tennis","quiz":{"q":"Topspin makes the ball...","o":["Dive down","Float up","Stop dead"],"a":0}},{"id":"slams","cat":"tennis","t":"The Grand Slams","e":"🏆","w":"Grand Slam (tennis)","hook":"The four biggest tournaments on Earth.","body":["Tennis has four majors: the Australian Open, French Open, Wimbledon and US Open. Winning all four in one year is called a Grand Slam.","Each is played on a different surface. Wimbledon is grass, the French Open is clay, and Australia and the US use hard courts.","Only a handful of players have ever won all four in a single year."],"wow":"Australia's Rod Laver won the Grand Slam twice, in 1962 and 1969. The main court at the Australian Open is named after him.","act":"Watch one match on each surface. Can you spot how differently the ball bounces?","talk":"Ask your family which Grand Slam they would most like to visit.","wk":"w_tennis","quiz":{"q":"Wimbledon is played on...","o":["Grass","Clay","Ice"],"a":0}},{"id":"readopp","cat":"tennis","t":"Reading Your Opponent","e":"🧠","w":"Tennis","hook":"Tennis is chess at 200 km/h.","body":["Great players watch more than the ball. They watch the racket, the feet and the body shape to guess where the ball is going.","If your opponent's shoulder opens early, the ball often goes cross-court. If they lean in, expect it down the line.","Patterns matter too. Most players have favourite shots under pressure. Find theirs and you can predict them."],"wow":"Some pros study video of opponents for hours, like a detective building a case.","act":"Watch a match and, before each shot, guess where the ball will go. Count how often you are right.","talk":"Ask someone: what is your 'tell' when you are nervous?","wk":"w_tennis","quiz":{"q":"Reading an opponent means watching...","o":["Their body and racket","The crowd","The scoreboard"],"a":0}},{"id":"ausopen","cat":"tennis","t":"The Australian Open","e":"🇦🇺","w":"Australian Open","hook":"Melbourne's own Grand Slam.","body":["Every January, the world's best tennis players come to Melbourne for the Australian Open.","It is famous for brutal heat. Matches can be played in 40 degree heat, and there is a 'heat policy' that can pause play.","The blue courts at Melbourne Park are some of the fastest in the world, which suits big servers."],"wow":"The Australian Open was first played in 1905. It is older than television, and even older than the first football World Cup.","act":"If you are in Melbourne in January, go watch a practice session. It is often free and you see the pros up close.","talk":"Ask your family who their favourite tennis player is and why.","wk":"w_tennis","quiz":{"q":"The Australian Open is played in which city?","o":["Melbourne","Sydney","Perth"],"a":0}},{"id":"shot","cat":"basketball","t":"The Physics of a Perfect Shot","e":"🎯","w":"Basketball","hook":"Why the best shot is an arc, not a line.","body":["A basketball shot is a maths problem. The ball must arc up and drop through the hoop at the right angle.","A higher arc gives a bigger target, because the hoop looks wider from above. That is why coaches say 'shoot up, not out'.","The best shooters put backspin on the ball, so if it hits the rim it bounces softly and can still drop in."],"wow":"Stephen Curry has made over 3,500 three-pointers, more than any player in NBA history.","act":"Shoot 10 shots aiming flat, then 10 with a high arc. Which goes in more?","talk":"Ask your family to guess why a soft bounce off the rim is better than a hard one.","wk":"w_basketball","quiz":{"q":"A higher arc makes the hoop look...","o":["Bigger","Smaller","The same"],"a":0}},{"id":"dribble","cat":"basketball","t":"Dribbling Like a Drum","e":"🎵","w":"Dribbling","hook":"Your hand is the beat.","body":["Dribble with your fingertips, not your palm. Fingertips give you control.","Keep your head up, not looking at the ball. Great players dribble while watching the whole court.","Change of speed is the real trick. Anyone can go fast. Going slow, then fast, beats a defender."],"wow":"Some players dribble so low the ball barely leaves the floor. It is almost impossible to steal.","act":"Dribble 50 times with your right hand, then 50 with your left. Then try walking while keeping your head up.","talk":"Ask someone to guard you for one minute. How many times can you keep the ball?","wk":"w_basketball","quiz":{"q":"You should dribble with your...","o":["Fingertips","Palm","Elbow"],"a":0}},{"id":"three","cat":"basketball","t":"The Three-Point Revolution","e":"3⃣","w":"Three-point field goal","hook":"The shot that changed basketball forever.","body":["The three-point line is a big arc far from the hoop. Score from beyond it and you get 3 points instead of 2.","When the line arrived, teams realised maths mattered. Three points is 50 percent more than two, so long shots became worth it.","Today, teams take far more threes than they did 20 years ago. It is called the three-point revolution."],"wow":"In some games, more than half of all shots are three-pointers. The game has completely changed.","act":"Stand behind a line and count your points: 3 per long shot, 2 per close shot. Which wins over 20 shots?","talk":"Ask your family: would you rather be a sharpshooter or a big dunker?","wk":"w_basketball","quiz":{"q":"A shot from behind the arc is worth...","o":["3 points","2 points","1 point"],"a":0}},{"id":"defence","cat":"basketball","t":"Defence Wins Games","e":"🛡️","w":"Basketball positions","hook":"The half of the game nobody practises.","body":["Defence is about moving your feet, not your hands. Stay in front of your player and make them work.","Great defenders watch the player's belly button, because it cannot fake. Feet and hips tell you where they are really going.","Teams that defend well win championships. It is the quiet superpower of basketball."],"wow":"Some players are famous almost only for defence, and they still earn millions.","act":"In a game, count how many times your team scores after a good defensive stop. Defence creates offence.","talk":"Ask someone: which is more fun to watch, a big block or a big dunk?","wk":"w_basketball","quiz":{"q":"On defence, you should watch the opponent's...","o":["Belly button","Eyes","Shoes"],"a":0}},{"id":"nba","cat":"basketball","t":"From a Peach Basket to the World","e":"🌍","w":"National Basketball Association","hook":"Basketball started with a fruit basket.","body":["Basketball was invented in 1891 by a teacher, James Naismith, using a peach basket and a soccer ball.","Today the NBA is watched in over 200 countries, and players come from all over the world.","There is a growing Aussie crew in the NBA. Australia is now one of the biggest basketball nations outside the US."],"wow":"The first basketball game used a ladder to get the ball out of the peach basket after every score.","act":"Find one NBA player born outside the USA. Which country are they from?","talk":"Ask your family which country they think will win the next Olympic basketball gold.","wk":"w_basketball","quiz":{"q":"Basketball was invented in...","o":["1891","1991","1801"],"a":0}},{"id":"vedas","cat":"bharatiya","t":"The Vedas: The World's Oldest Notebooks","e":"📜","w":"Vedas","hook":"Ancient India's library of knowledge.","body":["The Vedas are among the oldest texts humans still use. They were composed in India over 3,000 years ago and passed down by memory for centuries before being written.","They contain hymns, but also early science: how to track the stars, build fire altars with exact geometry, and understand medicine and nature.","Think of them as the notebooks of a very curious civilisation, asking big questions about life, the sky and how the world works."],"wow":"The Rig Veda is one of the oldest books in any language, older than the finished pyramids of Giza.","act":"Look up a Vedic 'sulba sutra'. They used ropes to draw perfect right angles for altars. Try drawing one with string.","talk":"Ask your family which ancient Indian idea they are most proud of.","wk":"w_india","quiz":{"q":"The Vedas were composed about how many years ago?","o":["3,000+","300","30"],"a":0}},{"id":"aryabhata","cat":"bharatiya","t":"Aryabhata: The Boy Who Measured the Earth","e":"🔭","w":"Aryabhata","hook":"He did the maths when he was about your age.","body":["Aryabhata was a mathematician and astronomer in India around 500 CE. When he was only about 23, he wrote a book that changed science.","He figured out that the Earth spins on its axis, and he calculated the length of a year to within minutes of the real value.","He also worked with big numbers, square roots and a method for solving equations that looks like early algebra."],"wow":"Aryabhata said the Earth rotates, centuries before Europe believed it. India named its first satellite after him.","act":"Try Aryabhata's trick: watch when a bright star rises at the same spot each night. You are measuring the sky.","talk":"Ask your family: what would you discover if you looked at the sky every night for a year?","wk":"w_india","quiz":{"q":"Aryabhata lived around which year?","o":["500 CE","1500 CE","1800 CE"],"a":0}},{"id":"sushruta","cat":"bharatiya","t":"Sushruta: The Father of Surgery","e":"🩺","w":"Sushruta","hook":"A 2,600-year-old surgery manual.","body":["Around 600 BCE in India, Sushruta wrote one of the world's first surgery manuals. He described hundreds of operations and tools.","He even explained how to rebuild a nose, a skill used in India for centuries and later learned by surgeons around the world.","His book listed over 100 surgical instruments, many looking like tools we still use today."],"wow":"Sushruta taught that a surgeon must practise on fruit and vegetables first, before ever touching a patient.","act":"Try Sushruta's training: peel a cucumber with a spoon and try not to break the skin. Steady hands!","talk":"Ask your family if they would have the steady hands to be a surgeon.","wk":"w_india","quiz":{"q":"Sushruta is famous for...","o":["Surgery","Music","Farming"],"a":0}},{"id":"chola","cat":"bharatiya","t":"The Chola Navy: India's Ocean Explorers","e":"⛵","w":"Chola dynasty","hook":"India ruled the waves 1,000 years ago.","body":["Over a thousand years ago, the Chola kingdom of South India built one of the most powerful navies in the world.","Their ships sailed all the way to Southeast Asia, to places like present-day Indonesia, Malaysia and Thailand, for trade and friendship.","They built huge temples you can still visit today, and their art and ideas spread across the seas."],"wow":"Chola traders brought Indian culture to Bali. That is why you still see Hindu temples and names there today.","act":"Find the Chola temple at Thanjavur on a map. Notice how far their ships had to travel.","talk":"Ask your family: which ancient civilisation would you sail with?","wk":"w_india","quiz":{"q":"The Chola navy sailed mainly to...","o":["Southeast Asia","Europe","Antarctica"],"a":0}},{"id":"panchatantra","cat":"bharatiya","t":"Panchatantra: Animal Stories with a Twist","e":"🦊","w":"Panchatantra","hook":"Clever animals, sneaky lessons.","body":["The Panchatantra is a collection of animal stories written in India over 2,000 years ago, older than most storybooks on your shelf.","Each story stars clever animals: a lion, a crow, a tortoise, a mouse. The animals solve problems using brains, not strength.","The stories travelled the world, into Arabic, Persian and European tales. Many fables you know probably started here."],"wow":"The Panchatantra has been translated into more than 50 languages, one of the most travelled books in history.","act":"Write your own 5-line animal story with a lesson at the end. Keep it short and clever.","talk":"Ask your family which Panchatantra-style lesson they would teach a younger kid.","wk":"w_india","quiz":{"q":"The Panchatantra is a book of...","o":["Animal stories","Maps","Songs"],"a":0}},{"id":"sanskrit","cat":"bharatiya","t":"Sanskrit and Computers","e":"🗣️","w":"Sanskrit","hook":"Is an ancient language the key to computers?","body":["Sanskrit is one of the world's oldest languages, with very precise grammar rules written by Panini around 500 BCE.","Those rules are so exact and rule-based that some computer scientists study them. They look a bit like the logic used to program computers.","Some people claim Sanskrit is the 'best language for computers'. That is a bit of a myth, but its structured grammar really is amazing."],"wow":"Panini's grammar has about 4,000 rules and can describe the whole language, like a giant instruction manual.","act":"Write three rules for making plurals in English. See how fast you need 'exceptions'? Sanskrit tried to avoid that.","talk":"Ask your family which language they think sounds most like music.","wk":"w_india","quiz":{"q":"Sanskrit's famous grammar was written by...","o":["Panini","Aryabhata","Kalidasa"],"a":0}},{"id":"kangaroo","cat":"aussie","t":"Why Kangaroos Can't Walk Backwards","e":"🦘","w":"Kangaroo","hook":"Built to go forward, always.","body":["Kangaroos are built for hopping forward. Their big feet and thick tail make going backwards almost impossible.","That is why the kangaroo is on Australia's coat of arms, a symbol of always moving forward.","A red kangaroo can hop at 60 km/h and leap over 8 metres in a single bound."],"wow":"Baby kangaroos, called joeys, are born the size of a jellybean and crawl into the pouch to grow.","act":"Hop 10 times and measure how far you go. Compare it to a kangaroo's 8-metre leap.","talk":"Ask your family what animal they would put on a family coat of arms.","wk":"w_aussie","quiz":{"q":"The kangaroo on Australia's coat of arms shows...","o":["Moving forward","Speed","Jumping"],"a":0}},{"id":"afl","cat":"aussie","t":"AFL: The Sport Australia Invented","e":"🏉","w":"Australian rules football","hook":"Born in Melbourne in the 1850s.","body":["Australian Rules Football, the AFL, was invented in Melbourne in the 1850s. It is genuinely Australian.","It is fast and free-flowing. Players kick, handball and catch a ball on an oval field, and can run anywhere.","The Grand Final is one of the biggest sporting days in the country. Melbourne basically stops."],"wow":"AFL players can 'mark' the ball by catching it after a huge jump. Some marks are over 3 metres high.","act":"Practise a punt or a handball against a wall. How many clean catches in a row?","talk":"Ask your family which AFL team you should barrack for, and why.","wk":"w_sport_au","quiz":{"q":"AFL was invented in...","o":["Melbourne","Sydney","London"],"a":0}},{"id":"reef","cat":"aussie","t":"The Great Barrier Reef: A City Under the Sea","e":"🐠","w":"Great Barrier Reef","hook":"The biggest living thing on Earth.","body":["The Great Barrier Reef is the biggest living structure on Earth, so big you can see it from space.","It is built by tiny animals called coral polyps. Millions of them together create homes for thousands of species.","Sadly it is under threat from warming oceans, and scientists are racing to protect it."],"wow":"The Reef is home to over 1,500 kinds of fish and 400 kinds of coral, more than most countries have birds.","act":"Draw a coral reef with 5 different fish. Give each fish a job, like real reef animals have.","talk":"Ask your family one thing your household could do to help the ocean.","wk":"w_aussie","quiz":{"q":"The Great Barrier Reef is made by...","o":["Tiny coral animals","Rocks","Seaweed"],"a":0}},{"id":"platypus","cat":"aussie","t":"The Platypus: Nature's Weirdest Animal","e":"🦫","w":"Platypus","hook":"So strange, scientists thought it was a joke.","body":["The platypus has a duck's bill, a beaver's tail and otter's feet. Scientists first thought it was a fake.","It is a mammal that lays eggs. And males have a venomous spur on their back legs.","It hunts underwater with its eyes closed, sensing the tiny electricity that other animals give off."],"wow":"The platypus can sense electric fields. It is like a real-life superpower.","act":"Close your eyes and feel your way around a room using only touch. That is a bit like how a platypus hunts.","talk":"Ask your family: if you could mix three animals, which would you choose?","wk":"w_aussie","quiz":{"q":"The platypus is a mammal that...","o":["Lays eggs","Flies","Has no fur"],"a":0}},{"id":"southerncross","cat":"aussie","t":"The Southern Cross: Finding Your Way","e":"⭐","w":"Crux","hook":"How to navigate using the stars.","body":["The Southern Cross is a group of five bright stars you can see in Australian skies. It is on our flag.","For thousands of years, people used it to find south. Draw a line through the cross and it points the way.","Aboriginal and Torres Strait Islander peoples have used the stars for navigation, seasons and stories for tens of thousands of years."],"wow":"The Southern Cross is the smallest constellation, but one of the most famous in the southern sky.","act":"On a clear night, find the Southern Cross. Use it to point south. Check with a compass app.","talk":"Ask your family if they know any star stories from their own childhood.","wk":"w_aussie","quiz":{"q":"The Southern Cross helps you find...","o":["South","North","East"],"a":0}},{"id":"chips","cat":"bharat_tech","t":"India's Own Chip Mission","e":"💡","w":"Semiconductor","hook":"The tiny brains inside every phone, made in India.","body":["Every phone, car and rocket has a tiny chip inside it. That chip is the brain of the machine, and it is smaller than your fingernail.","For years India bought these chips from other countries. Now India is building its own factories, called fabs, to make them at home. The first big one is coming up in Gujarat.","Why does it matter? If you can make your own chips, no one can switch off your technology. You can build your own phones, satellites and computers, and thousands of young Indians get real engineering jobs."],"wow":"A single modern chip can hold more than 100 billion tiny switches, each thousands of times thinner than a hair.","act":"Look at a phone charger or a remote. Find the chip inside (a small black square). That little thing is a whole city of switches.","talk":"Ask your family: which things at home would stop working without chips?","wk":"w_india","quiz":{"q":"A chip factory is often called a...","o":["Fab","Barn","Mill"],"a":0}},{"id":"isro","cat":"bharat_tech","t":"ISRO: India Reaches the Moon","e":"🚀","w":"Chandrayaan-3","hook":"India landed where no one had gone before.","body":["In 2023, India's space agency ISRO landed a spacecraft near the Moon's south pole. No country had ever done that before.","The mission was called Chandrayaan-3. It carried a small rover named Pragyan, which rolled out and studied the moon dust and rocks.","ISRO did it for far less money than other countries spend, using clever engineering and thousands of young Indian scientists."],"wow":"The Moon's south pole may hold frozen water. If so, future astronauts could drink it and even make rocket fuel from it.","act":"Go outside on a full-moon night and look at the darker patches. Those are craters and plains. Imagine a small rover rolling there.","talk":"Ask your family what India should explore next — the Moon, Mars, or the deep ocean?","wk":"w_space","quiz":{"q":"India's Moon lander was called...","o":["Chandrayaan-3","Mangalyaan","Gaganyaan"],"a":0}},{"id":"upi","cat":"bharat_tech","t":"UPI: The Money Miracle","e":"📱","w":"Unified Payments Interface","hook":"India built a way to pay that the whole world now studies.","body":["In India you can pay for a cup of tea with a QR code and a phone. No cash, no card, no waiting.","This system is called UPI. It was built in India and is used by hundreds of millions of people every single day.","Other countries are now studying UPI to build their own versions, because it made paying simple, fast and nearly free for everyone, even in small villages."],"wow":"UPI handles billions of payments every month, more than many countries' card systems put together.","act":"Next time you buy something with a QR code, look at how fast it is. Count the seconds from scan to done.","talk":"Ask your family how they paid for things when they were your age.","wk":"w_india","quiz":{"q":"UPI lets people pay using...","o":["A QR code and phone","Only cash","Only foreign cards"],"a":0}},{"id":"navic","cat":"bharat_tech","t":"NavIC: India's Own GPS","e":"🛰️","w":"NavIC","hook":"India made its own satellites to find the way.","body":["Most phones use GPS, which belongs to America. India built its own version, called NavIC.","NavIC uses Indian satellites to tell you exactly where you are. It is especially good over India and the surrounding oceans.","Fishermen use it to find their way home, and it helps trucks, trains and rescue teams reach the right place quickly."],"wow":"NavIC covers the whole of India and 1,500 km around it, and it is being added to new phones.","act":"Open a maps app and see how it knows exactly where you are. Those signals are coming from satellites far above you.","talk":"Ask your family what they would do if maps stopped working one day.","wk":"w_space","quiz":{"q":"NavIC is India's own version of...","o":["GPS","Wi-Fi","Bluetooth"],"a":0}},{"id":"vivekananda","cat":"bharatiya","t":"Vivekananda's Great Speech","e":"🎙️","w":"Swami Vivekananda","hook":"A young Indian monk silenced a hall in America.","body":["In 1893, a young Indian monk named Swami Vivekananda travelled to Chicago to speak to the world's religions.","He began with two simple words: 'Sisters and brothers of America.' The whole hall stood up and clapped for minutes.","He told the world that India's idea is simple: help others, be strong, and treat every person as your own family. He said, 'Arise, awake, and stop not till the goal is reached.'"],"wow":"Vivekananda walked and travelled across India for years, mostly on foot, before he sailed to America.","act":"Learn his line by heart: 'Arise, awake, and stop not till the goal is reached.' Use it the next time something feels hard.","talk":"Ask your family which teacher or leader inspired them most when they were young.","wk":"w_india","quiz":{"q":"Vivekananda spoke in which city in 1893?","o":["Chicago","London","Tokyo"],"a":0}},{"id":"yoga","cat":"bharatiya","t":"Yoga: India's Gift to the World","e":"🧘","w":"Yoga","hook":"An old Indian practice that the whole world now uses.","body":["Yoga began in India thousands of years ago. It is a set of movements, breathing and stillness that keeps the body and mind healthy.","Today millions of people in every country practise yoga. There is even an International Yoga Day on 21 June, an idea India proposed to the world.","The old texts say the aim is balance: a steady body, a calm mind and a kind heart. It is not a competition, it is a daily habit."],"wow":"Yoga Day was celebrated in over 180 countries, one of the biggest shared events in the world.","act":"Try this for one week: every morning, sit still and breathe slowly for two minutes. Notice how you feel by day seven.","talk":"Ask your family to show you one stretch they do to feel better.","wk":"w_india","quiz":{"q":"International Yoga Day is on...","o":["21 June","1 January","15 August"],"a":0}},{"id":"roblox","cat":"games","t":"How a Roblox World Is Built","e":"🎮","w":"Roblox","hook":"You can build a whole game inside Roblox.","body":["Roblox is not one game. It is a place where millions of people build their own games, called experiences.","Creators use a free tool called Roblox Studio. They place blocks, add colours, write simple code and design rules like jumping, collecting or racing.","Many creators are teenagers. Some have built games played by millions and earned money doing what they love."],"wow":"Roblox runs on code written in a language called Lua, which is simple enough for a beginner to learn in a few weeks.","act":"Open Roblox Studio and build just one room with a door and a light. That is your first level.","talk":"Ask your friends which Roblox game they would build if they could.","wk":"w_science","quiz":{"q":"Games built in Roblox are called...","o":["Experiences","Channels","Sheets"],"a":0}},{"id":"nintendo","cat":"games","t":"Nintendo: 130 Years of Play","e":"🎮","w":"Nintendo","hook":"A company older than your great-grandparents.","body":["Nintendo started in Japan in 1889, making playing cards. It is older than cars and aeroplanes.","Later it created some of the world's most famous games: Mario, Zelda and Pokemon. Its idea has always been simple: make games that are fun for everyone, not just experts.","Nintendo also designs its own consoles, like the Switch, so the hardware and the games are built to fit each other perfectly."],"wow":"Nintendo was making products for more than 80 years before it made its first video game.","act":"Play an old Nintendo game like Mario and notice how it teaches you to play without any long instructions. That is clever design.","talk":"Ask your family which game they loved most as a kid.","wk":"w_science","quiz":{"q":"Nintendo began in 1889 making...","o":["Playing cards","Phones","Cars"],"a":0}},{"id":"ramanujan","cat":"maths","t":"Ramanujan: The Boy Who Knew Infinity","e":"∞","w":"Srinivasa Ramanujan","hook":"A clerk from a small Indian town stunned the world's mathematicians.","body":["Srinivasa Ramanujan grew up in a small town in Tamil Nadu. He had almost no training in maths, but he filled notebooks with formulas no one had ever seen.","He wrote a letter to a famous English mathematician, who realised at once that this was a genius. Ramanujan went on to solve problems that had puzzled experts for a hundred years.","His ideas are still used today, in computers and in the study of numbers."],"wow":"Ramanujan said the goddess Namagiri would show him the formulas in his dreams.","act":"Start a 'notebook of ideas' like Ramanujan. Write one number pattern you notice today.","talk":"Ask your family if anyone in your family was good at maths without being taught.","wk":"w_india","quiz":{"q":"Ramanujan grew up in...","o":["Tamil Nadu","London","Japan"],"a":0}},{"id":"cvraman","cat":"science","t":"C V Raman and the Blue Sea","e":"🌊","w":"C. V. Raman","hook":"He asked a simple question and won India's first science Nobel.","body":["Sailing home from Europe, C V Raman looked at the deep blue sea and asked: why is the water blue?","Everyone 'knew' it was just the sky reflecting. Raman did not believe it. He tested it carefully and found that light changes when it passes through certain things.","That discovery, now called the Raman Effect, won him the Nobel Prize in 1930, the first for science from Asia."],"wow":"The Raman Effect is used today to check medicines, gems and even to study distant planets.","act":"Fill a glass with water and look at it from different angles in sunlight. Notice how the colour changes.","talk":"Ask your family about a time a simple question led to a big answer.","wk":"w_india","quiz":{"q":"C V Raman won the Nobel Prize for...","o":["Science","Peace","Literature"],"a":0}},{"id":"lakshmibai","cat":"bharatiya","t":"Rani Lakshmibai of Jhansi","e":"🐎","w":"Rani Lakshmibai","hook":"The queen who rode into battle.","body":["Rani Lakshmibai was the queen of Jhansi. When her kingdom was taken from her, she did not give up. She trained, gathered her people and fought back.","She was famous for riding into battle with her young son tied to her back, so she could fight and protect him at the same time.","She was only about 29 when she fell. Even her enemies praised her courage, and she became a symbol of standing up for what is right."],"wow":"She was trained in riding, sword fighting and shooting from a young age, like a soldier.","act":"Learn one thing about a woman in Indian history and tell it to your family at dinner.","talk":"Ask your family which Indian hero they would want beside them in a tough moment.","wk":"w_india","quiz":{"q":"Rani Lakshmibai was queen of...","o":["Jhansi","Jaipur","Mysore"],"a":0}},{"id":"shivaji","cat":"bharatiya","t":"Chhatrapati Shivaji's Clever Escapes","e":"🏰","w":"Shivaji","hook":"He won with brains more often than with swords.","body":["Chhatrapati Shivaji built a kingdom in the hills of Maharashtra with a small, fast army.","He was a master of planning. Once, trapped in a fort surrounded by a huge enemy army, he escaped by hiding in a basket carried out of the gate.","He treated people fairly, respected all religions, and built a strong navy when few Indian kings had one. He showed that cleverness beats size."],"wow":"Shivaji built forts on hills and used the land itself as a weapon, like a giant chessboard.","act":"Draw a map of your house or school and mark three 'smart moves' you could make in a game there.","talk":"Ask your family about a time they solved a problem by being clever instead of strong.","wk":"w_india","quiz":{"q":"Shivaji built a strong...","o":["Navy","Railway","Airport"],"a":0}},{"id":"sangeet","cat":"bharatiya","t":"Why Indian Classical Music Feels Different","e":"🎵","w":"Hindustani classical music","hook":"Our music is built on ragas, not on songs you already know.","body":["In most music you know, a song has a tune you can hum. Indian classical music works differently. It is built on ragas.","A raga is a set of notes with a mood and rules, like a colour palette for sound. Some ragas are for morning, some for rain, some for calm.","The musician does not read notes from a page. They explore the raga slowly, building it up, until it feels like a whole story told in sound."],"wow":"There are hundreds of ragas, and each has a time of day when it is traditionally played.","act":"Listen to one raga for two minutes with your eyes closed. Write down one word for how it made you feel.","talk":"Ask your family if they have a favourite song from their childhood.","wk":"w_india","quiz":{"q":"A raga is a set of...","o":["Notes with a mood","Drums","Words"],"a":0}},{"id":"vedicmaths","cat":"maths","t":"Vedic Maths: Faster Than a Calculator","e":"🧮","w":"Vedic mathematics","hook":"Clever shortcuts that come from very old Indian ideas.","body":["Multiplying big numbers in your head feels hard. But there are clever shortcuts that make it easy.","For example, to multiply a number by 11, you just add the digits and put the answer in the middle. 23 x 11 becomes 2, (2+3), 3, which is 253.","These methods are called Vedic maths, named after old Indian ways of calculating that were written down as simple rules, called sutras."],"wow":"Using these tricks, students in India have done huge sums in their heads faster than people with calculators.","act":"Try the 11 trick on 34, 45 and 52. Then check your answers with a calculator.","talk":"Ask your family if they learned any maths shortcuts at school.","wk":"w_maths","quiz":{"q":"23 x 11 using the shortcut is...","o":["253","233","263"],"a":0}},{"id":"konark","cat":"bharatiya","t":"Konark: Science Carved in Stone","e":"☀️","w":"Konark Sun Temple","hook":"A temple built as a giant sundial.","body":["The Konark Sun Temple in Odisha is shaped like a huge chariot, with 24 carved stone wheels and horses pulling it.","Those wheels are not just decoration. Each one is a sundial. You can tell the time by where the shadow falls on the spokes.","Built about 800 years ago, it shows how Indian builders mixed art, maths and astronomy into one building."],"wow":"The temple's wheels can tell the time to within a few minutes, using only sunlight and shadow.","act":"Make a simple sundial with a stick and some stones. Mark the shadow every hour and see the pattern.","talk":"Ask your family about an old building they have visited and what was clever about it.","wk":"w_india","quiz":{"q":"The Konark temple is shaped like a...","o":["Chariot","Boat","Mountain"],"a":0}},{"id":"quantum","cat":"frontier","t":"Quantum Computers: Weird and Wonderful","e":"⚛️","w":"Quantum computing","hook":"The computers that think in maybe.","body":["A normal computer stores information as 0 or 1, like a light switch that is off or on. A quantum computer uses qubits, which can be a bit of both at once.","That sounds strange because it is. It means a quantum computer can explore many answers at the same time instead of one by one.","Scientists are using early quantum computers to design new medicines, better batteries and safer codes. They are not faster at everything - just at a few very hard puzzles."],"wow":"A quantum computer must be kept colder than deep space, otherwise the qubits lose their magic.","act":"Learn one new word today: 'qubit'. Explain it to someone using a coin that is both heads and tails while it spins.","talk":"Ask your family which problem they would ask a quantum computer to solve.","more":"https://en.wikipedia.org/wiki/Quantum_computing","wk":"w_space","quiz":{"q":"A quantum computer uses...","o":["Qubits","Bricks","Gears"],"a":0}},{"id":"ai","cat":"frontier","t":"How AI Actually Learns","e":"🧠","w":"Machine learning","hook":"Nobody programs it. It learns from examples.","body":["Old computer programs followed exact instructions. AI is different. You show it thousands of examples and it finds the pattern itself.","Show a computer a million photos labelled 'cat' and 'dog', and it slowly learns what makes a cat a cat. That is called machine learning.","The catch: AI can be confidently wrong, and it can copy the mistakes in the examples. So humans still have to check its work."],"wow":"Some AI models have read so much text that if a human read non-stop, it would take thousands of years.","act":"Play a learning game: think of a rule (like 'red things'), then let someone guess it from your yes/no answers. That is how AI learns.","talk":"Ask your family which jobs they think AI will help with most.","more":"https://en.wikipedia.org/wiki/Machine_learning","wk":"w_science","quiz":{"q":"AI learns mostly from...","o":["Examples","Rules typed by hand","Luck"],"a":0}},{"id":"robots","cat":"frontier","t":"Robots That Work Beside Us","e":"🤖","w":"Robotics","hook":"Not robots that take over. Robots that help.","body":["Robots are best at jobs that are dull, dirty or dangerous: lifting heavy loads, welding, exploring inside volcanoes or cleaning up spills.","Modern robots can also work next to people safely. Some help surgeons make tiny, steady cuts. Others pick fruit or pack boxes in warehouses.","The clever part is not the metal body. It is the software that lets the robot see, plan and adjust when things change."],"wow":"Some warehouse robots work as a team, like ants, and reorganise themselves when one breaks down.","act":"Look around your home and list three jobs a robot could do safely. Then list one it should never do.","talk":"Ask your family which household chore they would hand to a robot first.","more":"https://en.wikipedia.org/wiki/Robotics","wk":"w_science","quiz":{"q":"Robots are best at jobs that are...","o":["Dull, dirty or dangerous","Creative","Funny"],"a":0}},{"id":"drones","cat":"frontier","t":"Drones: Eyes in the Sky","e":"🚁","w":"Unmanned aerial vehicle","hook":"Flying machines with no pilot inside.","body":["A drone is an aircraft with no pilot on board. It is flown by remote control or by its own computer.","Drones already deliver medicines to remote villages, map farms to help crops grow better, and fly into disaster zones to find people quickly.","In India, drone pilots are a new kind of job. There are even drone racing leagues where pilots fly at over 150 km/h wearing video goggles."],"wow":"Some search drones carry thermal cameras and can spot a person's body heat through smoke or darkness.","act":"Design a drone for one job: delivering books, finding lost pets, or watering plants. Draw it and label the parts.","talk":"Ask your family what rules drones should follow in your neighbourhood.","more":"https://en.wikipedia.org/wiki/Unmanned_aerial_vehicle","wk":"w_science","quiz":{"q":"A drone is flown...","o":["With no pilot on board","By a pilot inside","By a kite string"],"a":0}},{"id":"crispr","cat":"frontier","t":"Biotech: Editing the Code of Life","e":"🧬","w":"CRISPR","hook":"Scientists can now edit DNA like a document.","body":["Inside every living thing is DNA, a long instruction code. A tool called CRISPR lets scientists find one line in that code and change it.","It works like find-and-replace in a word processor. Doctors have already used it to fix a faulty gene that caused a serious blood disease.","It is powerful, so it needs care. Scientists and countries are writing rules about what should and should not be edited."],"wow":"CRISPR was discovered by studying how bacteria fight off viruses. Nature invented it first.","act":"Write a five-word instruction, then 'edit' it by changing one letter. See how much the meaning shifts.","talk":"Ask your family which disease they would most want science to cure.","more":"https://en.wikipedia.org/wiki/CRISPR","wk":"w_science","quiz":{"q":"CRISPR is a tool for...","o":["Editing DNA","Flying","Counting"],"a":0}},{"id":"biorobot","cat":"frontier","t":"Bio-Robots and Soft Robots","e":"🐛","w":"Soft robotics","hook":"Robots that bend, squeeze and even grow.","body":["Most robots are hard metal. Soft robots are made from rubber, gels and stretchy materials, so they can squeeze through gaps and grip delicate things.","Scientists have built tiny soft robots that swim through blood vessels to deliver medicine, and robot fingers that pick up a ripe tomato without bruising it.","Some combine living cells with machines. A 'bio-robot' might use real muscle cells to move, powered by sugar instead of a battery."],"wow":"Researchers have made tiny walking 'biobots' from heart muscle cells that keep beating on their own.","act":"Test grip: try picking up a grape with two fingers, then with a soft sponge. Which is gentler? That is why soft robots matter.","talk":"Ask your family where a soft robot would be more useful than a hard one.","more":"https://en.wikipedia.org/wiki/Soft_robotics","wk":"w_science","quiz":{"q":"Soft robots are made from...","o":["Stretchy materials","Iron","Glass"],"a":0}},{"id":"print3d","cat":"frontier","t":"3D Printing: Building Layer by Layer","e":"🖨️","w":"3D printing","hook":"Instead of printing ink, it prints objects.","body":["A 3D printer lays down material in thin layers, over and over, until a whole object is built. Imagine drawing with a hot glue gun, but a million times more exact.","Engineers print rocket parts, dentists print teeth, and doctors print models of a patient's bones to plan a tricky operation.","In space, astronauts have printed spare tools on the space station instead of waiting months for a delivery from Earth."],"wow":"A 3D-printed rocket engine part can be made in one piece, where the old version needed hundreds of separate pieces bolted together.","act":"Build something in layers using paper strips, clay or blocks. Notice how the shape grows layer by layer.","talk":"Ask your family what they would print if a 3D printer could make anything.","more":"https://en.wikipedia.org/wiki/3D_printing","wk":"w_science","quiz":{"q":"A 3D printer builds objects...","o":["In layers","All at once","By carving"],"a":0}},{"id":"battery","cat":"frontier","t":"The Race for a Better Battery","e":"🔋","w":"Lithium-ion battery","hook":"The quiet invention that changes everything.","body":["Phones, laptops, electric cars and solar farms all need one thing: a way to store energy. That is the battery.","Lithium-ion batteries changed the world because they store a lot of energy in a small, light pack. Now scientists are racing to make batteries that charge faster and last longer.","Better batteries would mean electric planes, cheaper electric cars and power that keeps working even when the sun is not shining."],"wow":"India is building giant battery plants so that clean power can be stored for the evening, when solar panels stop working.","act":"Check three devices at home. Find the battery size written on each one and compare.","talk":"Ask your family how often they charge their phone, and what a better battery would change.","more":"https://en.wikipedia.org/wiki/Lithium-ion_battery","wk":"w_india","quiz":{"q":"Batteries are mainly used to...","o":["Store energy","Make light","Clean water"],"a":0}},{"id":"bci","cat":"frontier","t":"Talking to a Computer with Your Mind","e":"🧢","w":"Brain–computer interface","hook":"Brain-computer interfaces are moving from science fiction to science fact.","body":["A brain-computer interface reads the tiny electrical signals your brain makes and turns them into commands for a machine.","People who have lost the use of their hands have used these systems to type, move a cursor, or control a robotic arm just by thinking.","Scientists are also testing gentler versions: a headband that can tell when you are very focused, or a cap that helps someone learn to move a weak muscle again."],"wow":"Your brain runs on about the same power as a small light bulb, yet it can do maths, music and memory at once.","act":"Try this: think of a word and see if a friend can guess it from nothing. That gap is exactly what a brain-computer interface has to cross.","talk":"Ask your family which machine they would most want to control with their thoughts.","more":"https://en.wikipedia.org/wiki/Brain%E2%80%93computer_interface","wk":"w_science","quiz":{"q":"A brain-computer interface reads...","o":["Electrical signals in the brain","Your handwriting","Your voice"],"a":0}},{"id":"warmup","cat":"coaching","t":"How to Warm Up Like a Pro","e":"🔥","w":"Warm-up","hook":"Ten minutes that protect your whole match.","body":["Coaches never let a player walk straight on court and hit hard. The body needs to wake up first, or you pull something in the first five minutes.","A good warm-up has three parts. First, easy jogging and side-steps to raise your heart rate. Then arm circles, leg swings and gentle twists. Only then do you pick up a racket and start with slow, easy hits.","Finish with short sprints and a few serves at half speed. Now you are ready to play properly."],"wow":"Most muscle injuries in tennis happen in the first fifteen minutes, before the body is ready.","act":"Build your own 8-minute warm-up and do it before every hit this week. Write down how you feel in the first game.","talk":"Ask your coach or a parent what their warm-up was when they played sport.","wk":"w_tennis","quiz":{"q":"A warm-up should start with...","o":["Easy jogging and movement","Hard hitting","Serving"],"a":0}},{"id":"forehand","cat":"coaching","t":"Build a Forehand You Can Trust","e":"🎾","w":"Forehand (tennis)","hook":"The shot you will hit more than any other.","body":["Every forehand has the same five steps: turn your shoulders, take the racket back, step in, swing low to high, and finish over your shoulder.","The mistake most young players make is swinging with the arm only. The power comes from the legs and the turn of your body, not your elbow.","Aim for a smooth, repeatable swing rather than a fast one. A shot that lands in ten times out of ten beats a hard shot that lands in five."],"wow":"Pros hit the ball with the racket moving fastest just before contact, not after.","act":"Hit 20 forehands with a slow, smooth swing and count how many land in. Then try 20 hard ones. Which score is better?","talk":"Ask someone to watch your swing and tell you one thing to change.","wk":"w_tennis","quiz":{"q":"Forehand power comes mainly from...","o":["Legs and body turn","The elbow","The wrist"],"a":0}},{"id":"servedrills","cat":"coaching","t":"The Serve: Drills That Work","e":"🎯","w":"Serve (tennis)","hook":"Practise the toss before you practise the hit.","body":["The serve is the one shot you fully control, so it is worth real practice time.","Start with the toss alone. Put a racket cover on the ground in front of you and try to make the ball land on it, twenty times. If your toss is steady, your serve will be steady.","Then add the swing at half speed, and only after that hit at full power. Do ten serves to each service box, and keep score of how many land in."],"wow":"A consistent toss is the single biggest difference between a good junior serve and a great one.","act":"Do the racket-cover toss drill for five minutes before your next session. Notice how much easier the serve feels.","talk":"Ask your coach which part of your serve needs the most work.","wk":"w_tennis","quiz":{"q":"The first thing to practise on the serve is...","o":["The toss","The power","The celebration"],"a":0}},{"id":"mentalgame","cat":"coaching","t":"Win the Mental Game","e":"🧠","w":"Sports psychology","hook":"The scoreboard is not the only thing you are playing against.","body":["Every player makes mistakes. The difference between players is what they do in the next ten seconds.","Coaches teach a routine between points: turn away from the court, take one slow breath, say one short word to yourself, then walk back and play the next point fresh.","You cannot control the last point. You can control your breathing, your body language and your next decision. Focus only on those."],"wow":"A slow breath out actually calms your heart rate, which helps your hands stay steady.","act":"Pick one word to say to yourself between points, like 'next' or 'steady'. Use it for a whole practice match.","talk":"Ask your family how they stay calm before something important.","wk":"w_tennis","quiz":{"q":"Between points, a good routine is to...","o":["Breathe and reset","Think about the last mistake","Argue with the umpire"],"a":0}},{"id":"footwork","cat":"coaching","t":"Footwork: The Hidden Superpower","e":"👟","w":"Tennis strategy","hook":"You cannot hit a good shot from a bad position.","body":["Watch a pro match closely and you will see something surprising: they take many small steps, not a few big ones.","Small adjustment steps let you get into the perfect position just before the ball arrives. That is why their shots look easy.","After every shot, they push back towards the middle of the court, ready for the next ball. Coaches call this 'recovering'. Players who recover win more points."],"wow":"Pros take two or three extra adjustment steps on almost every shot. It is invisible, and it is the whole game.","act":"Play a game where you get a point for every time you take three small steps before hitting. Focus on feet, not power.","talk":"Ask your coach what your feet should be doing between shots.","wk":"w_tennis","quiz":{"q":"Before hitting, good players take...","o":["Small adjustment steps","One big leap","No steps"],"a":0}},{"id":"practise","cat":"coaching","t":"How to Practise So It Sticks","e":"🔁","w":"Practice (learning)","hook":"Ten focused minutes beat an hour of hitting for fun.","body":["Hitting balls back and forth is fun, but it does not always make you better. Focused practice does.","Pick ONE thing to work on, like your toss or your backhand slice. Do it slowly and correctly many times, and stop when you get tired, because tired practice teaches bad habits.","Then test it in a match. If it works under pressure, you have really learned it."],"wow":"Scientists call it 'deliberate practice': working on the hard parts on purpose, not just playing.","act":"Choose one shot and practise only that for ten minutes today. Write down what felt different.","talk":"Ask your coach which one thing would improve your game the most right now.","wk":"w_tennis","quiz":{"q":"Good practice means working on...","o":["One thing, slowly and correctly","Everything at once","Only your best shot"],"a":0}},{"id":"penicillin","cat":"experiments","t":"The Mould That Saved Millions","e":"🧫","w":"Penicillin","hook":"The greatest discovery in medicine happened by accident.","body":["In 1928 a scientist named Alexander Fleming came back from holiday and found mould growing on a dish of bacteria he had forgotten to clean.","Around the mould, the bacteria had died. Something in that mould was killing them.","That accident became penicillin, the first antibiotic. It has saved more lives than almost any other discovery in history. Fleming noticed because he was curious about something he could have thrown away."],"wow":"Fleming almost missed it. Another scientist had seen the same thing years earlier and did not follow up.","act":"Leave a slice of bread in a sealed bag for a week. Look at the mould with a magnifying glass, then throw it away and wash your hands.","talk":"Ask your family if anyone they know has needed antibiotics.","more":"https://en.wikipedia.org/wiki/Penicillin","wk":"w_science","quiz":{"q":"Penicillin was discovered by...","o":["Accident","Design","Luck and a computer"],"a":0}},{"id":"cavendish","cat":"experiments","t":"The Experiment That Weighed the Earth","e":"⚖️","w":"Cavendish experiment","hook":"One man weighed the whole planet in a shed.","body":["In 1798 Henry Cavendish wanted to weigh the Earth. He could not put it on a scale, so he did something clever.","He hung two lead balls from a wire and brought two bigger balls near them. The tiny pull between them twisted the wire by a hair's width.","By measuring that twist, he worked out how strong gravity is, and from that, the mass of the whole Earth. He was right to within a few percent."],"wow":"He measured a force thousands of times smaller than the weight of a grain of sand, without any electronics.","act":"Tie a small weight to a thread and watch it twist. Even a tiny push makes it turn. That is the trick Cavendish used.","talk":"Ask your family how heavy they think the Earth is. Then tell them the answer.","more":"https://en.wikipedia.org/wiki/Cavendish_experiment","wk":"w_space","quiz":{"q":"Cavendish measured...","o":["The mass of the Earth","The speed of light","The height of Everest"],"a":0}},{"id":"foucault","cat":"experiments","t":"Proof the Earth Turns","e":"🌀","w":"Foucault pendulum","hook":"A swinging weight that proves we are spinning.","body":["People once argued about whether the Earth moves. In 1851 a French scientist, Leon Foucault, settled it with a pendulum.","He hung a heavy ball on a long wire and set it swinging. Over hours, the swing slowly appeared to rotate.","It was not the pendulum turning. The floor was turning underneath it, because the Earth is spinning. You can see it yourself in science museums today."],"wow":"Foucault did his first public demonstration inside a famous Paris building, using a 28-kilogram ball.","act":"Hang a small weight on a long string and set it swinging. Watch it for ten minutes. Can you see it drift?","talk":"Ask your family how they would prove the Earth spins without leaving the ground.","more":"https://en.wikipedia.org/wiki/Foucault_pendulum","wk":"w_space","quiz":{"q":"A Foucault pendulum shows that...","o":["The Earth spins","The Sun moves","Magnets work"],"a":0}},{"id":"kitchenlab","cat":"experiments","t":"Five Experiments You Can Do Tonight","e":"🔬","w":"Experiment","hook":"A real lab is just a kitchen with a notebook.","body":["You do not need a laboratory. You need a question and something to write in.","Try these: float an egg in salt water and see how much salt it takes. Put a white flower in coloured water and watch the petals change. Drop a raisin in fizzy water and watch it rise and sink. Make a cloud in a jar with hot water and ice. Roll a coin down a ramp and change the angle.","For each one, write down what you expected and what actually happened. That difference is where the learning is."],"wow":"Almost every great scientist kept a notebook of things that surprised them.","act":"Pick one experiment and do it. Write two lines: what I thought would happen, and what happened.","talk":"Ask your family to guess the answer before you do the experiment.","more":"https://en.wikipedia.org/wiki/Experiment","wk":"w_science","quiz":{"q":"The most important part of an experiment is...","o":["Writing down what happened","Making it look neat","Doing it fast"],"a":0}},{"id":"mrbeast","cat":"creators","t":"MrBeast: The Most Watched Person on Earth","e":"📱","w":"MrBeast","hook":"He turned attention into a business, and giving into a strategy.","body":["MrBeast is one of the most-watched people in the world. His videos cost millions to make: giant mazes, islands, whole competitions.","The idea behind them is simple: make something so big that people cannot scroll past. He studies his own videos like a scientist, changing one thing at a time to see what works.","He also gives away huge amounts of money and food. Some people praise the giving; others ask whether giving is the same as fixing the problem. Both questions are worth thinking about."],"wow":"He has said he reads the first thirty seconds of a video over and over, because that is where most viewers leave.","act":"Watch one of his videos and write down three things he does in the first minute to keep you watching.","talk":"Ask your family: is giving away money a good way to help, or a show?","more":"https://en.wikipedia.org/wiki/MrBeast","wk":"w_science","quiz":{"q":"MrBeast is best known for...","o":["Huge challenge videos","Cooking shows","News reporting"],"a":0}},{"id":"viral","cat":"creators","t":"How a Video Goes Viral","e":"📈","w":"Viral phenomenon","hook":"It is not luck. It is a pattern.","body":["When a video spreads fast, we say it went viral. But there is usually a reason.","Videos that spread well tend to do three things: they grab you in the first few seconds, they make you feel something strong, and they make you want to send them to a friend.","The platforms then notice. If many people watch a video to the end, the platform shows it to more people. So the loop feeds itself."],"wow":"A video with fewer views but higher 'watch time' can beat one with more views, because the platform cares how long people stayed.","act":"Design a 30-second video idea for something you love. Write the first three seconds word for word. That is the hardest part.","talk":"Ask your family which advert or video they remember, and why.","more":"https://en.wikipedia.org/wiki/Viral_phenomenon","wk":"w_science","quiz":{"q":"Videos spread best when they...","o":["Grab you and make you feel something","Are very long","Have no sound"],"a":0}},{"id":"thinklike","cat":"thinking","t":"How to Think Like a Scientist","e":"🧠","w":"Scientific method","hook":"The most useful habit you will ever build.","body":["A scientist does four things over and over: ask a clear question, make a guess, test the guess, and change their mind if the test disagrees.","The hardest part is the last one. Our brains prefer to be right. Noticing when you are wrong is a skill, and like any skill it gets easier with practice.","You can use this anywhere: in maths, in sport, in arguments with friends. Ask: what would prove me wrong? If nothing could, it is not a belief worth holding."],"wow":"Scientists call a test that could prove you wrong a 'falsifiable' test. If nothing can prove it wrong, it is not science.","act":"Pick one thing you believe about yourself, like 'I am bad at maths'. What test could prove that wrong? Try it.","talk":"Ask your family for a time they changed their mind about something important.","more":"https://en.wikipedia.org/wiki/Scientific_method","wk":"w_maths","quiz":{"q":"A good test is one that could...","o":["Prove you wrong","Always agree with you","Be done quickly"],"a":0}},{"id":"gametheory","cat":"thinking","t":"Game Theory: Winning by Thinking Ahead","e":"♟️","w":"Game theory","hook":"The maths of other people's choices.","body":["Game theory is the study of what happens when your best move depends on what someone else does.","Imagine two shops on a beach. Where should each put their stall? If you think only about yourself, you both end up in the middle, crowded together, and the customers at the ends walk further.","Mathematicians study this to understand traffic, prices, and even why countries behave the way they do. The trick is always to ask: what will the other person do next?"],"wow":"A famous game theory result says that sometimes everyone acting selfishly makes everyone worse off.","act":"Play rock-paper-scissors ten times and write down your opponent's pattern. Then use it to win.","talk":"Ask your family about a decision where they had to guess what someone else would do.","more":"https://en.wikipedia.org/wiki/Game_theory","wk":"w_maths","quiz":{"q":"Game theory studies...","o":["Choices that depend on others","Only board games","How to run fast"],"a":0}},{"id":"disagree","cat":"thinking","t":"Why Two Smart People Can Disagree","e":"🤔","w":"Argument","hook":"Being clever does not stop you being wrong.","body":["Two intelligent people can look at the same facts and reach opposite conclusions. This is not always because one is lying.","It usually happens for three reasons: they trust different evidence, they care about different things, or they are answering slightly different questions without realising it.","The useful move is not to shout louder. It is to find out exactly which of those three is causing the gap."],"wow":"Lawyers and scientists both use this trick: before arguing, agree on what would change your mind.","act":"Next time you disagree with someone, ask them: 'what would change your mind?' See what happens.","talk":"Ask your family about an argument where both sides had a fair point.","more":"https://en.wikipedia.org/wiki/Argument","wk":"w_maths","quiz":{"q":"A useful first step in a disagreement is to...","o":["Find out what evidence you trust","Talk louder","Walk away"],"a":0}},{"id":"montyhall","cat":"thinking","t":"The Puzzle That Fooled Professors","e":"🚪","w":"Monty Hall problem","hook":"Three doors. One prize. Your brain will get it wrong.","body":["Three doors. Behind one is a prize. You pick a door. Then the host, who knows where the prize is, opens a different door showing nothing.","Now he asks: keep your door, or switch? Most people say it makes no difference. It does. Switching wins twice as often.","Why? When you first chose, you had a one-in-three chance. The host's action does not change that. So the other unopened door now carries the remaining two-thirds."],"wow":"When this puzzle was published, thousands of people wrote in to say it was wrong, including some with PhDs. It was not wrong.","act":"Play it with three cups and a friend, twenty times. Always switch. Count how often you win.","talk":"Ask your family to guess before you explain the answer.","more":"https://en.wikipedia.org/wiki/Monty_Hall_problem","wk":"w_maths","quiz":{"q":"In the three-door puzzle, switching wins...","o":["Twice as often","The same","Never"],"a":0}}],"faqs":[{"q":"why is the sky blue","a":"Sunlight is all colours mixed. Air scatters the blue light much more than the red, so blue reaches your eyes from every direction. Try the 'Why the Sky is Blue' topic!","topics":["skyblue"]},{"q":"what is zero","a":"Zero is a symbol for nothing. India gave the world the first clear rules for zero around 628 CE. It made modern maths and computers possible.","topics":["zero"]},{"q":"who invented basketball","a":"A teacher named James Naismith invented basketball in 1891, using a peach basket and a soccer ball.","topics":["nba"]},{"q":"what are the vedas","a":"The Vedas are among the oldest texts humans still use, composed in India over 3,000 years ago. They mix hymns with early science like astronomy and geometry.","topics":["vedas"]},{"q":"how do black holes work","a":"A black hole is where gravity is so strong that nothing, not even light, can escape. Most form when a giant star collapses.","topics":["blackhole"]},{"q":"what is the biggest number","a":"There isn't one. Whatever number you pick, you can always add 1. That idea is called infinity.","topics":["infinity"]},{"q":"how fast can a tennis serve go","a":"The fastest serve ever recorded was 263 km/h by Australia's Sam Groth.","topics":["serve"]},{"q":"why do kangaroos hop","a":"Kangaroos are built for hopping forward. Their big feet and strong tail make it super efficient, and they can't really go backwards.","topics":["kangaroo"]},{"q":"what is gravity","a":"Gravity is the invisible pull that objects with mass have on each other. Earth's gravity keeps you on the ground and the Moon in orbit.","topics":["blackhole"]},{"q":"why is the sea salty","a":"Rain wears down rocks and carries tiny amounts of salt into rivers, and rivers carry it to the sea. Over millions of years, the salt builds up.","topics":[]},{"q":"how do planes fly","a":"Wings are shaped so air moves faster over the top, which lowers the pressure there. The higher pressure below pushes the wing up. That lift holds the plane in the air.","topics":["skyblue"]},{"q":"what is the largest animal in the world","a":"The blue whale. It can grow longer than a basketball court and its heart is the size of a small car.","topics":[]},{"q":"who was aryabhata","a":"Aryabhata was an Indian mathematician and astronomer around 500 CE. He said the Earth spins, and he calculated the length of a year very accurately.","topics":["aryabhata"]},{"q":"why do we sleep","a":"Sleep lets your brain sort memories and your body repair itself. Dreams mostly happen in a stage called REM sleep.","topics":["dreams"]},{"q":"what is pi","a":"Pi is the distance around a circle divided by the distance across it. It is about 3.14 and the digits never end.","topics":["pi"]},{"q":"what is dna","a":"DNA is the instruction book inside every cell that tells your body how to grow and work. It is written in a code of four letters.","topics":[]},{"q":"why do we have leap years","a":"Earth takes about 365 and a quarter days to go around the Sun. Every four years we add an extra day, 29 February, to catch up.","topics":[]},{"q":"what is the fastest animal","a":"The peregrine falcon, which dives at over 300 km/h. On land, the cheetah wins at about 110 km/h.","topics":[]},{"q":"how do you do a three pointer","a":"Shoot from behind the big arc. Aim high, use your legs for power, and add backspin so the ball bounces softly off the rim.","topics":["three"]},{"q":"what is australia's national sport","a":"Australia doesn't have one official national sport, but AFL, cricket and rugby league are the biggest. AFL was invented in Melbourne.","topics":["afl"]}]};

/* ---- 15-minute session budget (never shown as a timer) ---- */
const SESSION_MS=15*60*1000, COOLDOWN_MS=15*60*1000;
let usedMs=0, lastTick=null, lockedAt=Number(localStorage.getItem("spark_locked")||0);
function locked(){ return lockedAt && Date.now()-lockedAt < COOLDOWN_MS; }
function tick(){
  if(document.hidden||locked()){ lastTick=null; return; }
  const now=Date.now();
  if(lastTick) usedMs += now-lastTick;
  lastTick=now;
  if(usedMs>=SESSION_MS && !lockedAt){ lockedAt=now; localStorage.setItem("spark_locked",String(now)); }
}
setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){tick();lastTick=null;} else lastTick=Date.now(); });

let EDITION=null, DECK=[], idx=0, TAB="news";

function buildDeck(){
  const news=(EDITION&&EDITION.news)||[];
  const PRI=["thinking","experiments","creators","frontier","bharatiya","bharat_tech","games"];
  const ours=TOPICS.filter(t=>PRI.includes(t.cat)).concat(TOPICS.filter(t=>!PRI.includes(t.cat)));
  const deck=[]; let ti=0;
  news.forEach(it=>{ deck.push({kind:"news",it:it}); if(ti<ours.length) deck.push({kind:"card",t:ours[ti++]}); });
  if(!deck.length && ours.length) deck.push({kind:"card",t:ours[0]});
  const scr=(EDITION&&EDITION.screen)||[];
  if(scr.length) deck.push({kind:"screen",items:scr});
  return deck;
}
function wisdom(i){ return WISDOM[i % WISDOM.length]; }

/* ---- images ---- */
const imgCache={};
async function getImage(t){
  if(imgCache[t.id]!==undefined) return imgCache[t.id];
  imgCache[t.id]=null;
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.w));
    if(!r.ok) return null;
    const j=await r.json();
    const small=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||null;
    if(!small) return null;
    imgCache[t.id]={big:small.replace(/\/\d+px-/,"/640px-"),small:small};
    return imgCache[t.id];
  }catch(e){return null;}
}
function hydrate(){
  document.querySelectorAll("[data-wid]").forEach(el=>{
    if(el.dataset.done) return; el.dataset.done="1";
    const t=byId[el.getAttribute("data-wid")]; if(!t) return;
    getImage(t).then(im=>{
      const img=el.querySelector("img")||el;
      if(im){ img.onerror=function(){img.onerror=null; if(im.small&&img.src!==im.small) img.src=im.small;};
        img.src=im.big||im.small; const p=el.querySelector(".ph"); if(p) p.remove(); }
    });
  });
}

function render(){

  if(!DECK.length){ $("#app").innerHTML=`<div class="loading">Getting today's stories…</div>`; $("#nav").innerHTML=""; return; }
  const c=DECK[idx];

function step(d){
